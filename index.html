<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>順番ルーレット Sui Edition</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<style>
  :root {
    --navy: #17324d;
    --navy-2: #214a6c;
    --cream: #fffaf0;
    --paper: #ffffff;
    --ink: #17324d;
    --muted: #657789;
    --line: #d9e2e8;
    --accent: #e96b4c;
    --accent-dark: #bd4d35;
    --gold: #f2c94c;
    --blue: #3b82b4;
    --blue-dark: #28678f;
    --danger: #b84c4c;
    --shadow: 0 16px 40px rgba(11, 34, 53, .22);
    --radius: 22px;
    --vh: 100vh;
  }

  @supports (height: 100dvh) {
    :root { --vh: 100dvh; }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "BIZ UDPGothic", "Yu Gothic", "Meiryo", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.16), transparent 30%),
      linear-gradient(145deg, var(--navy-2), var(--navy));
    min-height: var(--vh);
  }
  button, input, select { font: inherit; }
  button { touch-action: manipulation; }
  [hidden] { display: none !important; }

  .view { min-height: var(--vh); }
  .setup-view {
    padding: clamp(18px, 3vw, 36px);
    overflow-y: auto;
  }
  .setup-shell {
    width: min(1160px, 100%);
    margin: 0 auto;
  }
  .brand {
    color: #fff;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 22px;
  }
  .brand h1 {
    margin: 0;
    font-size: clamp(28px, 4vw, 46px);
    letter-spacing: .04em;
  }
  .brand p { margin: 8px 0 0; color: rgba(255,255,255,.82); }
  .privacy-badge {
    flex: 0 0 auto;
    border: 1px solid rgba(255,255,255,.4);
    background: rgba(255,255,255,.1);
    color: #fff;
    border-radius: 999px;
    padding: 9px 14px;
    font-weight: 700;
    font-size: 14px;
  }

  .panel {
    background: rgba(255,255,255,.97);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: clamp(20px, 4vw, 38px);
  }
  .intro {
    display: grid;
    grid-template-columns: 1.25fr .75fr;
    gap: clamp(20px, 4vw, 46px);
    align-items: center;
  }
  .intro h2 { margin: 0 0 10px; font-size: clamp(23px, 3vw, 34px); }
  .intro p { margin: 0; color: var(--muted); line-height: 1.75; }
  .intro-actions { display: grid; gap: 12px; }

  .button {
    border: 0;
    border-radius: 14px;
    padding: 13px 18px;
    font-weight: 800;
    cursor: pointer;
    transition: transform .08s, filter .15s, opacity .15s;
  }
  .button:hover { filter: brightness(1.04); }
  .button:active { transform: translateY(2px); }
  .button:focus-visible { outline: 4px solid rgba(242,201,76,.9); outline-offset: 3px; }
  .button:disabled { opacity: .42; cursor: not-allowed; transform: none; filter: none; }
  .primary { background: var(--accent); color: #fff; }
  .secondary { background: var(--blue); color: #fff; }
  .ghost { background: #edf3f6; color: var(--ink); }
  .danger { background: #f8e8e8; color: var(--danger); }
  .large { min-height: 54px; font-size: 18px; }

  .editor-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 20px;
  }
  .editor-head h2 { margin: 0; font-size: clamp(23px, 3vw, 32px); }
  .editor-head p { margin: 7px 0 0; color: var(--muted); }
  .count-badge {
    min-width: 92px;
    text-align: center;
    border-radius: 999px;
    background: #edf3f6;
    padding: 10px 16px;
    font-weight: 800;
  }
  .participant-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 15px;
  }
  .participant-card {
    border: 1px solid var(--line);
    border-radius: 18px;
    background: #fff;
    padding: 12px;
    box-shadow: 0 5px 14px rgba(11,34,53,.08);
  }
  .participant-media {
    aspect-ratio: 4 / 3;
    border-radius: 13px;
    background: var(--cream);
    display: grid;
    place-items: center;
    overflow: hidden;
    margin-bottom: 10px;
    font-size: 72px;
  }
  .participant-media img { width: 100%; height: 100%; object-fit: contain; }
  .name-input {
    width: 100%;
    border: 2px solid var(--line);
    border-radius: 11px;
    padding: 10px 11px;
    font-weight: 700;
    color: var(--ink);
  }
  .name-input:focus { border-color: var(--blue); outline: 3px solid rgba(59,130,180,.18); }
  .card-actions { display: grid; grid-template-columns: 1fr 1fr auto; gap: 7px; margin-top: 9px; }
  .icon-button {
    border: 0;
    border-radius: 10px;
    min-height: 38px;
    background: #edf3f6;
    color: var(--ink);
    font-weight: 800;
    cursor: pointer;
  }
  .icon-button.remove { color: var(--danger); background: #f8e8e8; }
  .icon-button:disabled { opacity: .32; cursor: not-allowed; }
  .editor-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
  }
  .start-row {
    border-top: 1px solid var(--line);
    margin-top: 22px;
    padding-top: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
  }
  .start-row small { color: var(--muted); line-height: 1.6; }
  .loading-line { margin-top: 14px; color: var(--blue-dark); font-weight: 700; }

  .roulette-view {
    min-height: var(--vh);
    color: #fff;
    overflow: hidden;
  }
  .play-topbar {
    height: 68px;
    padding: 10px max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .play-title { font-weight: 900; letter-spacing: .05em; font-size: 19px; }
  .top-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .top-button {
    border: 1px solid rgba(255,255,255,.42);
    background: rgba(255,255,255,.13);
    color: #fff;
    backdrop-filter: blur(6px);
    border-radius: 11px;
    padding: 9px 12px;
    cursor: pointer;
    font-weight: 700;
  }
  .top-button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .top-button:disabled { opacity: .38; cursor: not-allowed; }

  .play-layout {
    height: calc(var(--vh) - 68px);
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(230px, 310px);
    gap: 16px;
    padding: 0 16px 16px;
  }
  .stage {
    min-width: 0;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto auto;
    place-items: center;
    gap: clamp(10px, 2vh, 18px);
  }
  .roulette-card {
    width: min(70vh, 72vw, 720px);
    aspect-ratio: 1 / 1;
    border: clamp(10px, 2vw, 20px) solid var(--gold);
    border-radius: 30px;
    background: var(--cream);
    box-shadow: 0 10px 30px rgba(0,0,0,.30), inset 0 0 0 4px rgba(0,0,0,.12);
    overflow: hidden;
    display: grid;
    place-items: center;
    color: var(--ink);
    font-size: min(40vh, 38vw);
    position: relative;
  }
  .roulette-card img { width: 100%; height: 100%; object-fit: contain; padding: 10px; }
  .roulette-card.selected::after {
    content: "";
    position: absolute;
    inset: 5px;
    border: 6px solid var(--accent);
    border-radius: 18px;
    pointer-events: none;
  }
  .roulette-card.pop { animation: pop .38s ease-out; }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.035); } 100% { transform: scale(1); } }

  .current-name {
    min-height: 1.35em;
    max-width: 80vw;
    text-align: center;
    font-size: clamp(23px, 4vw, 38px);
    font-weight: 900;
    letter-spacing: .03em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .status-line {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    min-height: 30px;
    color: rgba(255,255,255,.86);
    font-weight: 700;
  }
  .main-button {
    border: 0;
    min-width: min(380px, 78vw);
    padding: clamp(15px, 2.5vh, 23px) 40px;
    border-radius: 999px;
    background: linear-gradient(160deg, var(--accent), var(--accent-dark));
    color: #fff;
    font-size: clamp(24px, 4vw, 34px);
    font-weight: 900;
    letter-spacing: .08em;
    box-shadow: 0 10px 0 var(--accent-dark), 0 16px 30px rgba(0,0,0,.3);
    cursor: pointer;
    margin-bottom: 10px;
  }
  .main-button:active { transform: translateY(6px); box-shadow: 0 4px 0 var(--accent-dark), 0 10px 20px rgba(0,0,0,.28); }
  .main-button:disabled {
    background: linear-gradient(160deg, #697684, #4b5661);
    box-shadow: 0 6px 0 #37404a, 0 10px 20px rgba(0,0,0,.24);
    color: rgba(255,255,255,.72);
    cursor: not-allowed;
    transform: none;
  }
  .main-button.complete { background: linear-gradient(160deg, var(--blue), var(--blue-dark)); box-shadow: 0 10px 0 var(--blue-dark), 0 16px 30px rgba(0,0,0,.3); }

  .history-panel {
    min-height: 0;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(255,255,255,.09);
    border-radius: 20px;
    padding: 14px;
    display: flex;
    flex-direction: column;
  }
  .history-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .history-head h2 { font-size: 17px; margin: 0; }
  .history-head span { color: rgba(255,255,255,.75); font-size: 14px; }
  .history-list { overflow-y: auto; display: grid; gap: 9px; padding: 2px; }
  .history-empty { color: rgba(255,255,255,.68); line-height: 1.7; padding: 20px 8px; text-align: center; }
  .history-item {
    display: grid;
    grid-template-columns: 36px 54px minmax(0,1fr);
    align-items: center;
    gap: 9px;
    border-radius: 13px;
    background: rgba(255,255,255,.11);
    padding: 7px;
  }
  .history-order { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font-weight: 900; }
  .history-media { width: 54px; height: 54px; border-radius: 9px; background: var(--cream); display: grid; place-items: center; overflow: hidden; font-size: 32px; }
  .history-media img { width: 100%; height: 100%; object-fit: contain; }
  .history-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; }
  .result-button { margin-top: auto; width: 100%; }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(7, 19, 31, .82);
    display: grid;
    place-items: center;
    padding: 20px;
  }
  .modal-box {
    width: min(780px, 96vw);
    max-height: min(88vh, 820px);
    overflow: auto;
    background: #fff;
    color: var(--ink);
    border-radius: 24px;
    box-shadow: 0 24px 70px rgba(0,0,0,.42);
    padding: clamp(20px, 4vw, 34px);
  }
  .modal-box.small { width: min(470px, 94vw); }
  .modal-head { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 18px; }
  .modal-head h2 { margin: 0; }
  .close-x { border: 0; background: #edf3f6; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; font-weight: 900; }
  .result-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 13px; }
  .result-card { border: 1px solid var(--line); border-radius: 15px; padding: 9px; position: relative; background: #fff; }
  .result-media { aspect-ratio: 1 / 1; display: grid; place-items: center; background: var(--cream); border-radius: 11px; overflow: hidden; font-size: 66px; }
  .result-media img { width: 100%; height: 100%; object-fit: contain; }
  .result-name { margin-top: 8px; font-weight: 800; text-align: center; overflow-wrap: anywhere; }
  .result-num { position: absolute; top: -8px; left: -8px; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 900; }
  .settings-grid { display: grid; gap: 18px; }
  .setting { display: grid; gap: 7px; }
  .setting label { font-weight: 900; }
  .setting small { color: var(--muted); line-height: 1.55; }
  .setting select { border: 2px solid var(--line); border-radius: 11px; padding: 11px; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .toggle-row input { width: 24px; height: 24px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .confirm-text { line-height: 1.7; font-weight: 700; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    z-index: 150;
    max-width: min(90vw, 650px);
    background: rgba(7,19,31,.94);
    color: #fff;
    border: 1px solid rgba(255,255,255,.24);
    border-radius: 14px;
    padding: 12px 18px;
    box-shadow: var(--shadow);
    font-weight: 700;
  }



  /* Sui Edition v1.1 */
  body {
    font-family:
      "BIZ UDPGothic",
      "Hiragino Kaku Gothic ProN",
      "Hiragino Sans",
      "Yu Gothic",
      "YuGothic",
      "Meiryo",
      system-ui,
      sans-serif;
  }
  .participant-media,
  .roulette-face,
  .history-media,
  .result-media {
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  .brand { align-items: center; }
  .privacy-note {
    margin-top: 14px !important;
    padding: 11px 14px;
    border-radius: 12px;
    background: #edf5f8;
    color: var(--ink) !important;
    font-weight: 700;
    line-height: 1.65 !important;
  }
  .card-actions { display: flex; justify-content: flex-end; margin-top: 9px; }
  .card-actions .remove { min-width: 78px; padding: 0 14px; }

  .roulette-view {
    height: var(--vh);
    min-height: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
  }
  .play-topbar { height: auto; min-height: 68px; }
  .play-layout {
    height: auto;
    min-height: 0;
    grid-template-columns: minmax(0, 1fr) minmax(240px, 310px);
  }
  .stage {
    min-height: 0;
    overflow: hidden;
    grid-template-rows: minmax(0, 1fr) auto auto;
  }
  .stage-visual {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .roulette-card {
    width: var(--roulette-size, min(62vh, 62vw, 720px));
    height: var(--roulette-size, min(62vh, 62vw, 720px));
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: auto;
    flex: 0 0 auto;
  }
  .roulette-face {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .roulette-card img,
  .roulette-face > img {
    display: block;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    padding: 10px;
  }
  .current-name:empty { visibility: hidden; }

  .history-head { gap: 10px; }
  .history-controls { display: flex; align-items: center; gap: 9px; }
  .result-button { width: auto; margin: 0; padding: 8px 11px; white-space: nowrap; }
  .history-list { min-height: 0; flex: 1 1 auto; }

  .setting.toggle-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 14px;
  }
  .toggle-copy { min-width: 0; }
  .toggle-copy label, .toggle-copy small { display: block; }
  .toggle-copy small { margin-top: 7px; }
  .switch-control {
    position: relative;
    display: inline-flex;
    width: 54px;
    height: 30px;
    flex: 0 0 54px;
    cursor: pointer;
  }
  .toggle-input {
    position: absolute;
    width: 1px !important;
    height: 1px !important;
    opacity: 0;
    pointer-events: none;
  }
  .toggle-switch {
    position: absolute;
    inset: 0;
    border: 2px solid #9cacb8;
    border-radius: 999px;
    background: #dce4e9;
    transition: background .18s, border-color .18s;
  }
  .toggle-switch::after {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    left: 2px;
    top: 2px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 7px rgba(20,45,65,.28);
    transition: transform .18s;
  }
  .toggle-input:checked + .toggle-switch { background: var(--blue); border-color: var(--blue-dark); }
  .toggle-input:checked + .toggle-switch::after { transform: translateX(24px); }
  .toggle-input:focus-visible + .toggle-switch { outline: 4px solid rgba(242,201,76,.9); outline-offset: 3px; }

  .reset-options { display: grid; gap: 12px; }
  .reset-option {
    width: 100%;
    border: 2px solid var(--line);
    border-radius: 15px;
    background: #fff;
    color: var(--ink);
    padding: 15px 16px;
    text-align: left;
    cursor: pointer;
  }
  .reset-option:hover { border-color: var(--blue); background: #f5fafc; }
  .reset-option:focus-visible { outline: 4px solid rgba(242,201,76,.9); outline-offset: 2px; }
  .reset-option.destructive { border-color: #eccaca; background: #fff8f8; color: var(--danger); }
  .reset-option-title { display: block; font-weight: 900; font-size: 17px; }
  .reset-option-text { display: block; margin-top: 6px; font-weight: 600; line-height: 1.55; color: var(--muted); }
  .reset-option.destructive .reset-option-text { color: #865b5b; }

  @media (orientation: portrait), (max-width: 760px) {
    .intro { grid-template-columns: 1fr; }
    .play-layout {
      grid-template-columns: 1fr;
      grid-template-rows: minmax(0, 1fr) minmax(120px, 25vh);
      gap: 9px;
      padding: 0 9px 9px;
    }
    .history-panel { min-height: 120px; padding: 10px; }
    .history-head { margin-bottom: 7px; }
    .history-list {
      grid-auto-flow: column;
      grid-auto-columns: minmax(190px, 230px);
      overflow-x: auto;
      overflow-y: hidden;
    }
    .history-empty { padding: 10px; }
    .stage { gap: clamp(7px, 1.5vh, 12px); }
    .main-button { margin-bottom: 2px; }
  }

  @media (max-width: 620px) {
    .editor-head, .start-row { flex-direction: column; align-items: stretch; }
    .start-row .button { width: 100%; }
    .play-topbar { align-items: flex-start; }
    .play-title { padding-top: 8px; }
    .top-actions { max-width: 78%; }
    .top-button { padding: 8px 9px; font-size: 13px; }
    .history-head h2 { font-size: 15px; }
    .result-button { font-size: 13px; padding: 7px 9px; }
  }

  @media (orientation: landscape) and (max-height: 650px) {
    .play-topbar { min-height: 56px; padding-top: 6px; padding-bottom: 6px; }
    .play-layout { gap: 10px; padding: 0 10px 10px; }
    .stage { gap: 6px; }
    .current-name { font-size: clamp(19px, 3.2vw, 28px); }
    .status-line { min-height: 24px; font-size: 14px; }
    .main-button { padding: 12px 34px; font-size: clamp(21px, 3vw, 28px); margin-bottom: 2px; }
  }



  /* Sui Edition v1.2 */
  .setup-shell { width: min(980px, 100%); }
  .title-panel { padding: clamp(26px, 5vw, 54px); }
  .intro { grid-template-columns: minmax(0, 1.15fr) minmax(240px, .85fr); }
  .intro-copy h1 {
    margin: 0;
    font-size: clamp(38px, 5.2vw, 58px);
    line-height: 1.12;
    letter-spacing: .035em;
    color: var(--ink);
    white-space: nowrap;
  }
  .title-lead { margin-top: 18px !important; font-size: clamp(17px, 2.3vw, 22px); color: var(--ink) !important; font-weight: 800; }
  .privacy-note {
    margin-top: 20px !important;
    padding: 0;
    border-radius: 0;
    background: transparent;
    color: var(--muted) !important;
    font-weight: 600;
  }

  .button.pseudo-disabled {
    opacity: .42;
    filter: grayscale(.15);
    cursor: not-allowed;
    transform: none;
  }

  .media-box {
    position: relative;
    overflow: hidden;
    display: grid;
    place-items: center;
    min-width: 0;
    min-height: 0;
  }
  .media-box > img {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .emoji-content {
    display: block;
    max-width: 100%;
    max-height: 100%;
    line-height: 1;
    text-align: center;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  .participant-media .emoji-content { font-size: 68px; }
  .history-media .emoji-content { font-size: 32px; }

  function uid(prefix = "p") {
    return crypto.randomUUID?.() || `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
  }

  function loadSavedSettings() {
    try {
      const raw = localStorage.getItem(SETTINGS_STORAGE_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      if (["slow", "standard", "fast"].includes(saved.speed)) state.settings.speed = saved.speed;
      if (["short", "standard", "long"].includes(saved.stopLength)) state.settings.stopLength = saved.stopLength;
      ["oneTouch", "hideSelectedDuringSpin", "reduceEffects"].forEach(key => {
        if (typeof saved[key] === "boolean") state.settings[key] = saved[key];
      });
      if (typeof saved.soundOn === "boolean") state.soundOn = saved.soundOn;
    } catch (error) {
      console.warn("設定を読み込めませんでした。", error);
    }
  }

  function saveSettingsToStorage() {
    try {
      localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify({ ...state.settings, soundOn: state.soundOn }));
    } catch (error) {
      console.warn("設定を保存できませんでした。", error);

  function escapeNameFromFile(fileName) {
    return fileName.replace(/\.[^.]+$/, "").trim() || "名前なし";

  function createParticipant({ type = "emoji", value = "🙂", name = "", defaultName = name, sampleKey = null } = {}) {
    return { id: uid(), type, value, name, defaultName: defaultName || name, sampleKey };
  }

  function createFaceNode(participant, className = "") {
    const wrapper = document.createElement("div");
    wrapper.className = [className, "media-box"].filter(Boolean).join(" ");
    if (!participant) return wrapper;
    if (participant.type === "image") {
      const img = document.createElement("img");
      img.src = participant.value;
      img.alt = "";
      img.decoding = "async";
      wrapper.appendChild(img);
    } else {
      const emoji = document.createElement("span");
      emoji.className = "emoji-content";
      emoji.textContent = participant.value;
      wrapper.appendChild(emoji);
    }
    return wrapper;
  }

  function applyNameClass(element, name) {
    const length = Array.from(name || "").length;
    element.classList.toggle("name-medium", length > 10 && length <= 18);
    element.classList.toggle("name-long", length > 18);

  function releaseParticipant(participant) {

  function removeParticipant(id) {
    const index = state.participants.findIndex(participant => participant.id === id);
    if (index < 0) return;
    releaseParticipant(state.participants[index]);
    state.participants.splice(index, 1);
    renderEditor();

  function shuffled(items) {
    const copy = [...items];
    for (let index = copy.length - 1; index > 0; index -= 1) {
      const swapIndex = randomInt(index + 1);
      [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
    }
    return copy;
  }

  function unusedSamples() {
    const used = new Set(state.participants.map(participant => participant.sampleKey).filter(Boolean));
    return sampleParticipants.filter(sample => !used.has(sample.value));

  async function decodeImage(file) {
    if (window.createImageBitmap) {
      try {
        return await createImageBitmap(file, { imageOrientation: "from-image" });
      } catch (error) {
        console.warn("createImageBitmapでの読込に失敗しました。", error);
      }
    }
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => { URL.revokeObjectURL(url); resolve(image); };
      image.onerror = () => { URL.revokeObjectURL(url); reject(new Error(`${file.name}を読み込めませんでした。`)); };
      image.src = url;
    });
  }

  async function resizeImage(file) {
    const source = await decodeImage(file);
    try {
      const sourceWidth = source.width || source.naturalWidth;
      const sourceHeight = source.height || source.naturalHeight;
      const longest = Math.max(sourceWidth, sourceHeight);
      if (!longest) throw new Error("画像サイズを取得できませんでした。");
      const scale = Math.min(1, MAX_IMAGE_EDGE / longest);
      const width = Math.max(1, Math.round(sourceWidth * scale));
      const height = Math.max(1, Math.round(sourceHeight * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d", { alpha: true });
      if (!context) throw new Error("画像処理を開始できませんでした。");
      context.imageSmoothingEnabled = true;
      context.imageSmoothingQuality = "high";
      context.drawImage(source, 0, 0, width, height);
      const type = file.type === "image/png" ? "image/png" : "image/jpeg";
      const blob = await new Promise((resolve, reject) => canvas.toBlob(result => result ? resolve(result) : reject(new Error("画像の縮小に失敗しました。")), type, .9));
      const defaultName = escapeNameFromFile(file.name);
      return createParticipant({ type: "image", value: URL.createObjectURL(blob), name: defaultName, defaultName });
    } finally {
      if (typeof source.close === "function") source.close();
    }
  }

  async function handleImageFiles(fileList) {
    const available = MAX_PARTICIPANTS - state.participants.length;
    if (available <= 0) {
      showToast("参加者は最大30人です");
      return;
    }
    const selected = Array.from(fileList || []);
    if (!selected.length) return;
    if (selected.length > available) {
      alert(`画像は最大30枚です。選択された画像のうち${available}枚を読み込みます。`);
    }
    const files = selected.slice(0, available);
    state.phase = Phase.LOADING;
    loadingLine.hidden = false;
    loadingLine.textContent = `画像を読み込み中… 0/${files.length}`;
    const firstImageBtn = $("firstImageBtn");
    const addImageBtn = $("addImageBtn");
    firstImageBtn.disabled = true;
    addImageBtn.disabled = true;
    firstImageBtn.textContent = `読み込み中… 0/${files.length}`;
    addImageBtn.textContent = `読み込み中… 0/${files.length}`;
    updateEditorVisibility();
    const failedFiles = [];
    for (let index = 0; index < files.length; index += 1) {
      try {
        state.participants.push(await resizeImage(files[index]));
      } catch (error) {
        console.error(error);
        failedFiles.push(files[index].name || `画像${index + 1}`);
      }
      const progressText = `読み込み中… ${index + 1}/${files.length}`;
      loadingLine.textContent = `画像を${progressText}`;
      firstImageBtn.textContent = progressText;
      addImageBtn.textContent = progressText;
    }
    state.phase = Phase.SETUP;
    loadingLine.hidden = true;
    firstImageBtn.disabled = false;
    addImageBtn.disabled = false;
    firstImageBtn.textContent = "画像を選ぶ";
    addImageBtn.textContent = "画像を追加";
    imageInput.value = "";
    renderEditor();
    if (failedFiles.length) showImageErrors(files.length, failedFiles);
  }

    state.stopTimer = null;
    state.autoStopTimer = null;

  function randomInt(maxExclusive) {
    if (!Number.isInteger(maxExclusive) || maxExclusive <= 0) return 0;
    if (!crypto.getRandomValues) return Math.floor(Math.random() * maxExclusive);
    const limit = Math.floor(0x100000000 / maxExclusive) * maxExclusive;
    const array = new Uint32Array(1);
    do { crypto.getRandomValues(array); } while (array[0] >= limit);
    return array[0] % maxExclusive;
  }

  function participantById(id) {
    return state.participants.find(participant => participant.id === id) || null;

  function getUnselected() {
    return state.participants.filter(participant => !state.selectedIds.has(participant.id));

  function buildSpinPool() {
    const unselected = getUnselected();
    return state.settings.hideSelectedDuringSpin ? unselected : [...state.participants];

  function updateRouletteInteraction() {

    rouletteCard.classList.toggle("one-touch", enabled);
    rouletteCard.classList.toggle("busy", enabled && (state.phase === Phase.SPINNING || state.phase === Phase.STOPPING));
    if (enabled) {
      rouletteCard.setAttribute("role", "button");
      rouletteCard.tabIndex = 0;
      const label = state.phase === Phase.SPINNING || state.phase === Phase.STOPPING

      rouletteCard.setAttribute("aria-label", label);
      rouletteCard.setAttribute("aria-disabled", String(state.phase === Phase.SPINNING || state.phase === Phase.STOPPING || state.phase === Phase.COMPLETE));
    } else {
      rouletteCard.removeAttribute("role");

      rouletteCard.removeAttribute("aria-label");

  function closeMenuPopover({ restoreFocus = false } = {}) {
    if (menuPopover.hidden) return;
    menuPopover.hidden = true;

    if (restoreFocus) $("menuBtn").focus();

  function positionMenuPopover() {
    if (menuPopover.hidden) return;
    const buttonRect = $("menuBtn").getBoundingClientRect();
    const gap = 7;
    menuPopover.style.visibility = "hidden";
    menuPopover.style.left = "0px";
    menuPopover.style.top = "0px";
    const popoverRect = menuPopover.getBoundingClientRect();
    let left = buttonRect.right - popoverRect.width;
    left = Math.max(8, Math.min(left, window.innerWidth - popoverRect.width - 8));
    let top = buttonRect.bottom + gap;
    if (top + popoverRect.height > window.innerHeight - 8) top = Math.max(8, buttonRect.top - popoverRect.height - gap);
    menuPopover.style.left = `${Math.round(left)}px`;
    menuPopover.style.top = `${Math.round(top)}px`;
    menuPopover.style.visibility = "visible";
  }

  function openMenuPopover() {
    if (state.phase === Phase.SPINNING || state.phase === Phase.STOPPING) return;
    const opening = menuPopover.hidden;
    closeMenuPopover();
    if (!opening) return;
    menuPopover.hidden = false;
    $("menuBtn").setAttribute("aria-expanded", "true");
    positionMenuPopover();
    requestAnimationFrame(() => focusableElements(menuPopover)[0]?.focus());

  function renderPlayState() {
    const remaining = state.participants.length - state.order.length;
    remainingStatus.textContent = `残り${remaining}人`;
    historyCount.textContent = `${state.order.length}人`;
    showResultsBtn.disabled = state.order.length === 0;
    const busy = state.phase === Phase.SPINNING || state.phase === Phase.STOPPING;
    const undoDisabled = busy || state.order.length === 0;
    $("undoBtn").disabled = undoDisabled;
    $("undoBtn").setAttribute("aria-disabled", String(undoDisabled));
    $("menuBtn").disabled = busy;
    $("menuBtn").setAttribute("aria-disabled", String(busy));
    $("soundBtn").disabled = false;
    $("fullscreenBtn").disabled = false;
    if (busy) closeMenuPopover();

    if (state.phase === Phase.COMPLETE) {
      mainButton.textContent = "スタート";
      mainButton.classList.remove("complete");
      mainButton.disabled = true;
      orderStatus.textContent = "全員の順番が決まりました";
    } else if (state.phase === Phase.SPINNING) {
      mainButton.textContent = "ストップ";
      mainButton.classList.remove("complete");
      mainButton.disabled = false;
      orderStatus.textContent = "回転中";
    } else if (state.phase === Phase.STOPPING) {
      mainButton.textContent = "スタート";
      mainButton.classList.remove("complete");
      mainButton.disabled = true;
      orderStatus.textContent = "決定中";
    } else {
      mainButton.textContent = "スタート";
      mainButton.classList.remove("complete");
      mainButton.disabled = false;
      orderStatus.textContent = state.order.length ? `${state.order.length}番まで決定` : "まだ選ばれていません";
    }
    updateRouletteInteraction();
    renderHistory();
  }

  function renderHistory() {
    historyList.replaceChildren();
    if (!state.order.length) return;
    state.order.forEach((id, index) => {
      const participant = participantById(id);
      const item = document.createElement("div");
      item.className = "history-item";
      const order = document.createElement("div");
      order.className = "history-order";
      order.textContent = String(index + 1);
      const media = createFaceNode(participant, "history-media");
      const name = document.createElement("div");
      name.className = "history-name";
      name.textContent = participant.name;
      applyNameClass(name, participant.name);
      item.append(order, media, name);
      historyList.appendChild(item);
    });
    if (!state.settings.reduceEffects) {
      historyList.scrollTo({ left: historyList.scrollWidth, top: historyList.scrollHeight, behavior: "smooth" });
    }
  }

  let audioContext = null;
  function ensureAudio() {
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === "suspended") audioContext.resume().catch(() => {});
  }
  function playTick() {
    if (!state.soundOn || !audioContext) return;
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    oscillator.type = "square";
    oscillator.frequency.value = 650;
    gain.gain.setValueAtTime(.055, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(.0001, audioContext.currentTime + .045);
    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start();
    oscillator.stop(audioContext.currentTime + .05);
  }
  function playStop() {
    if (!state.soundOn || !audioContext) return;
    [523, 659, 784].forEach((frequency, index) => {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const time = audioContext.currentTime + index * .085;
      oscillator.type = "triangle";
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(.0001, time);
      gain.gain.exponentialRampToValueAtTime(.15, time + .02);
      gain.gain.exponentialRampToValueAtTime(.0001, time + .32);
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(time);
      oscillator.stop(time + .34);
    });
  }

  function startSpin() {
    const pool = buildSpinPool();
    if (!pool.length) return;
    stopTimers();
    state.spinPool = pool;
    const currentPosition = pool.findIndex(participant => participant.id === state.currentId);
    state.poolPosition = currentPosition >= 0 ? currentPosition : 0;
    state.phase = Phase.SPINNING;
    rouletteCard.classList.remove("selected", "pop");
    renderPlayState();
    const interval = speedMap[state.settings.speed];
    state.spinTimer = setInterval(() => {
      state.poolPosition = (state.poolPosition + 1) % state.spinPool.length;
      const participant = state.spinPool[state.poolPosition];
      state.currentId = participant.id;
      showParticipant(participant, false);
      playTick();
    }, interval);
  }

  function easeInCubic(t) { return t * t * t; }

  function stopSpin() {
    stopTimers();
    const candidates = getUnselected();
    if (!candidates.length) return;
    const target = candidates[randomInt(candidates.length)];
    const targetPosition = state.spinPool.findIndex(participant => participant.id === target.id);
    const poolLength = state.spinPool.length;
    const forward = (targetPosition - state.poolPosition + poolLength) % poolLength;
    const config = stopMap[state.settings.stopLength];
    let totalSteps = forward + config.extraCycles * poolLength;
    while (totalSteps < config.minSteps) totalSteps += poolLength;
    const easingSteps = Math.min(15, Math.max(8, Math.round(Math.sqrt(totalSteps) * 2.2)));
    const easingStart = totalSteps - easingSteps;
    const baseDelay = speedMap[state.settings.speed];
    let completed = 0;

    state.phase = Phase.STOPPING;
    renderPlayState();

    const nextDelay = () => {
      if (completed < easingStart) return baseDelay;
      const progress = Math.min(1, (completed - easingStart) / Math.max(1, easingSteps - 1));
      return Math.round(baseDelay + (config.maxDelay - baseDelay) * easeInCubic(progress));
    };

    const advance = () => {
      state.poolPosition = (state.poolPosition + 1) % poolLength;
      const participant = state.spinPool[state.poolPosition];
      state.currentId = participant.id;
      showParticipant(participant, false);
      playTick();
      completed += 1;
      if (completed < totalSteps) {
        state.stopTimer = setTimeout(advance, nextDelay());
      } else {
        finishSelection(target);
      }
    };
    state.stopTimer = setTimeout(advance, nextDelay());
  }

  function playSelectionOverlay() {
    if (state.settings.reduceEffects) return;
    const rect = rouletteCard.getBoundingClientRect();
    const clone = rouletteCard.cloneNode(true);
    clone.removeAttribute("id");
    clone.querySelectorAll("[id]").forEach(element => element.removeAttribute("id"));
    clone.classList.remove("pop", "one-touch", "busy");
    clone.classList.add("selection-overlay-card");
    Object.assign(clone.style, {
      left: `${rect.left}px`,
      top: `${rect.top}px`,
      width: `${rect.width}px`,
      height: `${rect.height}px`
    });
    document.body.appendChild(clone);
    clone.addEventListener("animationend", () => clone.remove(), { once: true });
    setTimeout(() => clone.remove(), 700);
  }

  function finishSelection(target) {
    state.currentId = target.id;
    state.order.push(target.id);
    state.selectedIds.add(target.id);
    state.phase = state.order.length === state.participants.length ? Phase.COMPLETE : Phase.RESULT;
    showParticipant(target, true);
    rouletteCard.classList.remove("pop");
    playSelectionOverlay();
    playStop();
    renderPlayState();
  }

  function undoLastResult() {
    if (!state.order.length || state.phase === Phase.SPINNING || state.phase === Phase.STOPPING) return;
    const removedId = state.order.pop();
    state.selectedIds.delete(removedId);
    const previousId = state.order.at(-1) || null;
    state.currentId = previousId;
    state.phase = state.order.length ? Phase.RESULT : Phase.READY;
    const previous = participantById(previousId);
    showParticipant(previous, Boolean(previous));
    rouletteCard.classList.remove("pop");
    renderPlayState();
    showToast("直前の結果を取り消しました。", 2200);
  }

  function resetOrder(render = true) {
    stopTimers();
    state.order = [];
    state.selectedIds = new Set();
    state.currentId = null;
    state.spinPool = [];
    state.poolPosition = 0;
    state.phase = rouletteView.hidden ? Phase.SETUP : Phase.READY;
    showParticipant(null, false);
    rouletteCard.classList.remove("selected", "pop");
    if (render) renderPlayState();
  }

  function openResults() {
    state.modalReturnFocus = document.activeElement;
    resultGrid.replaceChildren();
    state.order.forEach((id, index) => {
      const participant = participantById(id);
      const card = document.createElement("article");
      card.className = "result-card";
      const number = document.createElement("div");
      number.className = "result-num";
      number.textContent = String(index + 1);
      const media = createFaceNode(participant, "result-media");
      const name = document.createElement("div");
      name.className = "result-name";
      name.textContent = participant.name;
      applyNameClass(name, participant.name);
      card.append(number, media, name);
      resultGrid.appendChild(card);
    });
    openModal(resultsModal, $("closeResultsBtn"));
  }

  function setStepSelector(selector, value, focus = false) {
    const options = Array.from(selector.querySelectorAll(".step-option"));
    const index = Math.max(0, options.findIndex(option => option.dataset.value === value));
    selector.dataset.value = options[index].dataset.value;
    selector.style.setProperty("--step-progress", `${index * 50}%`);
    options.forEach((option, optionIndex) => {
      const selected = optionIndex === index;
      option.setAttribute("aria-checked", String(selected));
      option.tabIndex = selected ? 0 : -1;
      option.classList.toggle("is-reached", optionIndex <= index);
    });
    if (focus) options[index].focus();
  }

  function setupStepSelector(selector) {
    const options = Array.from(selector.querySelectorAll(".step-option"));
    options.forEach((option, index) => {
      option.addEventListener("click", () => setStepSelector(selector, option.dataset.value));
      option.addEventListener("keydown", event => {
        if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
        event.preventDefault();
        let nextIndex = index;
        if (event.key === "ArrowLeft") nextIndex = Math.max(0, index - 1);
        if (event.key === "ArrowRight") nextIndex = Math.min(options.length - 1, index + 1);
        if (event.key === "Home") nextIndex = 0;
        if (event.key === "End") nextIndex = options.length - 1;
        setStepSelector(selector, options[nextIndex].dataset.value, true);
      });
    });
    setStepSelector(selector, selector.dataset.value || options[0].dataset.value);
  }

  function populateSettingsControls(settings = state.settings) {
    setStepSelector($("speedSelector"), settings.speed);
    setStepSelector($("stopSelector"), settings.stopLength);
    $("oneTouchToggle").checked = settings.oneTouch;
    $("hideSelectedToggle").checked = settings.hideSelectedDuringSpin;
    $("reduceEffectsToggle").checked = settings.reduceEffects;
  }

  function openSettings() {
    state.settingsDraftSoundOn = state.soundOn;
    populateSettingsControls();
    $("motionNote").textContent = "演出を少なくします。ルーレットの回転速度は変わりません。";
    openModal(settingsModal, $("speedSelector").querySelector('[aria-checked="true"]'));
  }

  function saveSettings() {
    state.settings.speed = $("speedSelector").dataset.value;
    state.settings.stopLength = $("stopSelector").dataset.value;
    state.settings.oneTouch = $("oneTouchToggle").checked;
    state.settings.hideSelectedDuringSpin = $("hideSelectedToggle").checked;
    state.settings.reduceEffects = $("reduceEffectsToggle").checked;
    state.soundOn = state.settingsDraftSoundOn;
    $("soundBtn").setAttribute("aria-pressed", String(state.soundOn));
    setIconButton($("soundBtn"), state.soundOn ? iconMarkup.soundOn : iconMarkup.soundOff, state.soundOn ? "音を消す" : "音を出す");
    saveSettingsToStorage();
    closeModal(settingsModal);
    renderPlayState();
    requestAnimationFrame(updateRouletteSize);
  }

  function openConfirm(message, action, okLabel = "実行する") {
    state.confirmAction = action;
    $("confirmText").textContent = message;
    $("confirmOkBtn").textContent = okLabel;
    openModal(confirmModal, $("confirmCancelBtn"));
  }

  function openModal(modal, initialFocus) {
    state.modalReturnFocus = document.activeElement;
    modal.hidden = false;
    rouletteView.inert = !rouletteView.hidden;
    setupView.inert = !setupView.hidden;
    requestAnimationFrame(() => initialFocus?.focus());
  }

  function closeModal(modal, restoreFocus = true) {
    modal.hidden = true;
    rouletteView.inert = false;
    setupView.inert = false;
    if (restoreFocus && state.modalReturnFocus?.isConnected) state.modalReturnFocus.focus();
    state.modalReturnFocus = null;
  }

  function focusableElements(container) {
    return Array.from(container.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), [href], [tabindex]:not([tabindex="-1"])')).filter(element => !element.hidden && element.offsetParent !== null);
  }

  function handleModalKeys(event, modal, closeAllowed = true) {
    if (event.key === "Escape" && closeAllowed) {
      event.preventDefault();
      closeModal(modal);
      return;
    }
    if (event.key !== "Tab") return;
    const focusable = focusableElements(modal);
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable.at(-1);
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }

  function isFullscreen() { return Boolean(document.fullscreenElement || document.webkitFullscreenElement); }
  async function toggleFullscreen() {
    try {
      if (!isFullscreen()) {
        const request = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
        if (!request) throw new Error("Fullscreen API unavailable");
        await Promise.resolve(request.call(document.documentElement));
      } else {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (!exit) throw new Error("Fullscreen API unavailable");
        await Promise.resolve(exit.call(document));
      }
    } catch (error) {
      console.error(error);
      showToast("全画面表示を切り替えられませんでした。");
    }
  }

  $("firstImageBtn").addEventListener("click", () => { imageInput.value = ""; imageInput.click(); });
  $("addImageBtn").addEventListener("click", () => { imageInput.value = ""; imageInput.click(); });
  $("firstNameBtn").addEventListener("click", startNameOnly);
  $("addNameBtn").addEventListener("click", () => addNameParticipant());
  $("sampleBtn").addEventListener("click", loadSample);
  imageInput.addEventListener("change", event => handleImageFiles(event.target.files));
  $("backToIntroBtn").addEventListener("click", () => openConfirm(
    "登録した参加者を消して、はじめの画面に戻ります。",
    () => { closeModal(confirmModal); returnToStart(); },
    "はじめに戻る"
  ));
  beginBtn.addEventListener("click", enterRoulette);

  mainButton.addEventListener("click", () => {
    ensureAudio();
    if (state.phase === Phase.SPINNING) stopSpin();
    else if (state.phase === Phase.READY || state.phase === Phase.RESULT) startSpin();
  });

  function activateOneTouch() {
    if (!state.settings.oneTouch) return;
    if (state.phase !== Phase.READY && state.phase !== Phase.RESULT) return;
    ensureAudio();
    startSpin();
    state.autoStopTimer = setTimeout(() => {
      state.autoStopTimer = null;
      if (state.phase === Phase.SPINNING) stopSpin();
    }, 1200);
  }

  rouletteCard.addEventListener("click", activateOneTouch);
  rouletteCard.addEventListener("keydown", event => {
    if (!state.settings.oneTouch || (event.key !== "Enter" && event.key !== " ")) return;
    event.preventDefault();
    activateOneTouch();
  });

  $("undoBtn").addEventListener("click", () => {
    if ($("undoBtn").disabled) return;
    openConfirm(
      "直前の結果を取り消しますか？",
      () => {
        closeModal(confirmModal, false);
        undoLastResult();
        $("undoBtn").focus();
      },
      "取り消す"
    );
  });

  $("menuBtn").setAttribute("aria-haspopup", "menu");
  $("menuBtn").setAttribute("aria-expanded", "false");
  $("menuBtn").addEventListener("click", event => {
    event.stopPropagation();
    openMenuPopover();
  });
  menuPopover.addEventListener("click", event => event.stopPropagation());
  menuPopover.addEventListener("keydown", event => {
    if (event.key === "Escape") { event.preventDefault(); closeMenuPopover({ restoreFocus: true }); return; }
    if (!["ArrowDown", "ArrowUp", "Home", "End"].includes(event.key)) return;
    const items = focusableElements(menuPopover);
    if (!items.length) return;
    event.preventDefault();
    const current = Math.max(0, items.indexOf(document.activeElement));
    let next = current;
    if (event.key === "ArrowDown") next = (current + 1) % items.length;
    if (event.key === "ArrowUp") next = (current - 1 + items.length) % items.length;
    if (event.key === "Home") next = 0;
    if (event.key === "End") next = items.length - 1;
    items[next].focus();
  });
  document.addEventListener("click", () => closeMenuPopover());
  $("menuSettingsBtn").addEventListener("click", () => {
    closeMenuPopover();
    $("menuBtn").focus();
    openSettings();
  });
  $("menuResetBtn").addEventListener("click", () => {
    closeMenuPopover();
    $("menuBtn").focus();
    openReset();
  });

  $("closeResetBtn").addEventListener("click", () => closeModal(resetModal));
  $("restartRouletteBtn").addEventListener("click", () => {
    closeModal(resetModal);
    resetOrder();
    mainButton.focus();
  });
  $("editParticipantsBtn").addEventListener("click", () => {
    closeModal(resetModal);
    resetOrder(false);
    returnToEditor();
  });
  $("returnToStartBtn").addEventListener("click", () => {
    closeModal(resetModal);
    returnToStart();
  });
  resetModal.addEventListener("keydown", event => handleModalKeys(event, resetModal));

  setupStepSelector($("speedSelector"));
  setupStepSelector($("stopSelector"));
  $("resetSettingsBtn").addEventListener("click", () => {
    populateSettingsControls(DEFAULT_SETTINGS);
    state.settingsDraftSoundOn = DEFAULT_SETTINGS.soundOn;
    showToast("音の設定を含めて初期状態に戻します。決定すると保存されます。", 3400);
  });
  $("saveSettingsBtn").addEventListener("click", saveSettings);
  $("closeSettingsBtn").addEventListener("click", () => closeModal(settingsModal));
  settingsModal.addEventListener("keydown", event => handleModalKeys(event, settingsModal));

  const iconMarkup = Object.freeze({
    undo: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5"/><path d="M5 12h8a6 6 0 1 1 0 12"/></svg>',
    soundOn: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 8.5c1.2 1 1.8 2.1 1.8 3.5S17.2 14.5 16 15.5"/><path d="M18.6 6c2 1.7 3 3.7 3 6s-1 4.3-3 6"/></svg>',
    soundOff: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="m17 9 5 5M22 9l-5 5"/></svg>',
    fullscreen: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>',
    exitFullscreen: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8H3V3M16 8h5V3M8 16H3v5M16 16h5v5"/></svg>'
  });

  function setIconButton(button, markup, label) {
    button.innerHTML = markup;
    button.setAttribute("aria-label", label);
    button.title = label;
  }

  setIconButton($("undoBtn"), iconMarkup.undo, "直前の結果を取り消す");

  $("soundBtn").addEventListener("click", () => {
    state.soundOn = !state.soundOn;
    $("soundBtn").setAttribute("aria-pressed", String(state.soundOn));
    setIconButton($("soundBtn"), state.soundOn ? iconMarkup.soundOn : iconMarkup.soundOff, state.soundOn ? "音を消す" : "音を出す");
    if (state.soundOn) ensureAudio();
    saveSettingsToStorage();
  });
  $("fullscreenBtn").addEventListener("click", toggleFullscreen);
  const updateFullscreenIcon = () => {
    setIconButton($("fullscreenBtn"), isFullscreen() ? iconMarkup.exitFullscreen : iconMarkup.fullscreen, isFullscreen() ? "全画面表示を終了" : "全画面表示");
  };
  document.addEventListener("fullscreenchange", updateFullscreenIcon);
  document.addEventListener("webkitfullscreenchange", updateFullscreenIcon);

  showResultsBtn.addEventListener("click", openResults);
  $("closeResultsBtn").addEventListener("click", () => closeModal(resultsModal));
  resultsModal.addEventListener("keydown", event => handleModalKeys(event, resultsModal));

  $("closeImageErrorBtn").addEventListener("click", () => closeModal(imageErrorModal));
  imageErrorModal.addEventListener("keydown", event => handleModalKeys(event, imageErrorModal));

  $("confirmCancelBtn").addEventListener("click", () => closeModal(confirmModal));
  $("confirmOkBtn").addEventListener("click", () => state.confirmAction?.());
  confirmModal.addEventListener("keydown", event => handleModalKeys(event, confirmModal));

  const rouletteResizeObserver = new ResizeObserver(() => {
    updatePlayLayout();
    updateRouletteSize();
  });
  rouletteResizeObserver.observe(playLayout);
  rouletteResizeObserver.observe(stageVisual);
  window.addEventListener("orientationchange", () => requestAnimationFrame(() => {
    updatePlayLayout();
    updateRouletteSize();
    positionMenuPopover();
  }));
  window.addEventListener("resize", positionMenuPopover);
  window.addEventListener("beforeunload", event => {
    if (!state.participants.length) return;
    event.preventDefault();
    event.returnValue = "";
  });
  window.addEventListener("pagehide", event => {
    if (!event.persisted) releaseAllParticipants();
  });
  loadSavedSettings();
  setIconButton($("soundBtn"), state.soundOn ? iconMarkup.soundOn : iconMarkup.soundOff, state.soundOn ? "音を消す" : "音を出す");
  $("soundBtn").setAttribute("aria-pressed", String(state.soundOn));
  playLayout.classList.add("stacked");
  updateEditorVisibility();
})();
</script>
</body>
</html>
