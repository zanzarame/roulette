  async function decodeImage(file) {
    if (window.createImageBitmap) {
      try {
        return await createImageBitmap(file, { imageOrientation: "from-image" });
      } catch (error) {
        console.warn("createImageBitmapでの読込に失敗しました。", error);
      }
    }
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => { URL.revokeObjectURL(url); resolve(image); };
      image.onerror = () => { URL.revokeObjectURL(url); reject(new Error(`${file.name}を読み込めませんでした。`)); };
      image.src = url;
    });
  }

  async function resizeImage(file) {
    const source = await decodeImage(file);
    try {
      const sourceWidth = source.width || source.naturalWidth;
      const sourceHeight = source.height || source.naturalHeight;
      const longest = Math.max(sourceWidth, sourceHeight);
      if (!longest) throw new Error("画像サイズを取得できませんでした。");
      const scale = Math.min(1, MAX_IMAGE_EDGE / longest);
      const width = Math.max(1, Math.round(sourceWidth * scale));
      const height = Math.max(1, Math.round(sourceHeight * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d", { alpha: true });
      if (!context) throw new Error("画像処理を開始できませんでした。");
      context.imageSmoothingEnabled = true;
      context.imageSmoothingQuality = "high";
      context.drawImage(source, 0, 0, width, height);
      const type = file.type === "image/png" ? "image/png" : "image/jpeg";
      const blob = await new Promise((resolve, reject) => canvas.toBlob(result => result ? resolve(result) : reject(new Error("画像の縮小に失敗しました。")), type, .9));
      const defaultName = escapeNameFromFile(file.name);
      const objectUrl = URL.createObjectURL(blob);
      const preparedImage = new Image();
      preparedImage.decoding = "async";
      preparedImage.src = objectUrl;
      try {
        if (typeof preparedImage.decode === "function") await preparedImage.decode();
        else await new Promise((resolve, reject) => {
          preparedImage.onload = resolve;
          preparedImage.onerror = reject;
        });
      } catch (error) {
        URL.revokeObjectURL(objectUrl);
        throw new Error(`${file.name}を表示できる状態にできませんでした。`);
      }
      const participant = createParticipant({ type: "image", value: objectUrl, name: defaultName, defaultName });
      participant.decoded = true;
      return participant;
    } finally {
      if (typeof source.close === "function") source.close();
    }
  }

  async function handleImageFiles(fileList, editorAnchor = null) {
    const available = MAX_PARTICIPANTS - state.participants.length;
    const selected = Array.from(fileList || []);
    if (!selected.length) return;
    const wasTruncated = selected.length > Math.max(0, available);
    if (available <= 0) {
      showToast("0枚だけ読み込みました");
      return;
    }
    const files = selected.slice(0, available);
    const participantCountBeforeLoad = state.participants.length;
    setPhase(Phase.LOADING);
    const loadGeneration = bumpGeneration();
    const addImageBtn = $("addImageBtn");
    const addImageLabel = addImageBtn.querySelector(".editor-action-label");
    addImageBtn.disabled = true;
    addImageLabel.textContent = `読み込み中… 0/${files.length}`;
    updateEditorVisibility();
    const failedFiles = [];
    for (let index = 0; index < files.length; index += 1) {
      try {
        const participant = await resizeImage(files[index]);
        if (!generationIsCurrent(loadGeneration)) { releaseParticipant(participant); return; }
        state.participants.push(participant);
        newlyAddedParticipantIds.add(participant.id);
      } catch (error) {
        console.error(error);
        failedFiles.push(files[index].name || `画像${index + 1}`);
      }
      const progressText = `読み込み中… ${index + 1}/${files.length}`;
      addImageLabel.textContent = progressText;
    }
    setPhase(Phase.SETUP, { force: true });
    if (state.participants.length > 0 || editorAnchor) state.isEditorOpen = true;
    addImageBtn.disabled = false;
    imageInput.value = "";
    renderEditor();
    restoreEditorActionPosition(editorAnchor, { focus: failedFiles.length === 0 });
    if (wasTruncated) {
      const loadedCount = Math.max(0, state.participants.length - participantCountBeforeLoad);
      showToast(`${loadedCount}枚だけ読み込みました`);
    }
    if (failedFiles.length) showImageErrors(files.length, failedFiles);
  }

  function showImageErrors(total, failedFiles) {
    const success = total - failedFiles.length;
    $("imageErrorSummary").textContent = `${total}枚中${success}枚を読み込みました。${failedFiles.length}枚は読み込めませんでした。`;
    const list = $("imageErrorList");
    list.replaceChildren();
    failedFiles.forEach(fileName => {
      const item = document.createElement("li");
      item.textContent = fileName;
      list.appendChild(item);
    });
    openModal(imageErrorModal, $("closeImageErrorBtn"));
  }

  function validateNames() {
    let changed = false;
    state.participants.forEach(participant => {
      if (!participant.name.trim()) {
        participant.name = participant.defaultName || "名前なし";
        changed = true;
      } else {
        participant.name = participant.name.trim();
      }
    });
    if (changed) renderEditor();
  }

  async function ensureParticipantImagesReady() {
    const images = state.participants.filter(participant => participant.type === "image" && !participant.decoded);
    for (const participant of images) {
      const image = new Image();
      image.decoding = "async";
      image.src = participant.value;
      if (typeof image.decode === "function") await image.decode();
      participant.decoded = true;
    }
  }

  async function enterRoulette() {
    if (state.participants.length < 2) {
      showToast("2人以上登録してください");
      return;
    }
    const generation = bumpGeneration();
    setPhase(Phase.LOADING, { force: true });
    updateEditorVisibility();
    try {
      await ensureParticipantImagesReady();
    } catch (error) {
      console.error(error);
      if (generationIsCurrent(generation)) {
        setPhase(Phase.SETUP, { force: true });
        updateEditorVisibility();
        showToast("画像を準備できませんでした", { priority: 3, duration: 3200 });
      }
      return;
    }
    if (!generationIsCurrent(generation)) return;
    guardNextViewInteraction();
    syncNameDisplayMode();
    if (state.showNames) validateNames();
    resetOrder(false, { preserveGeneration: true });
    setPhase(Phase.READY, { force: true });
    setupView.hidden = true;
    rouletteView.hidden = false;
    animateViewIn(rouletteView);
    updatePlayLayout();
    renderPlayState();
    requestAnimationFrame(() => {
      updatePlayLayout();
      updateRouletteSize();
      focusForCurrentInput(state.settings.oneTouch ? rouletteCard : mainButton);
    });
  }


  function returnToEditorView() {
    guardNextViewInteraction();
    bumpGeneration();
    stopTimers();
    setPhase(Phase.SETUP, { force: true });
    state.isEditorOpen = true;
    rouletteView.hidden = true;
    resetSetupScrollPosition();
    setupView.hidden = false;
    renderEditor();
    resetSetupScrollPosition();
    animateViewIn(editorSection);
    releaseWakeLock();
    focusForCurrentInput($("editorTitle"));
  }


  function returnToEditor() {
    if (isAppleTouchDevice() && isFullscreen()) {
      exitFullscreenForAppleInteraction().finally(returnToEditorView);
      return;
    }
    returnToEditorView();
  }

  function returnToStart() {
    guardNextViewInteraction();
    bumpGeneration();
    stopTimers();
    releaseAllParticipants();
    state.participants = [];
    state.order = [];
    state.selectedIds = new Set();
    state.currentId = null;
    state.spinPool = [];
    state.poolPosition = 0;
    state.isEditorOpen = false;
    state.showNames = true;
    setPhase(Phase.SETUP, { force: true });
    rouletteView.hidden = true;
    setupView.hidden = false;
    showParticipant(null, false);
    rouletteCard.classList.remove("selected");
    resetSetupScrollPosition();
    renderEditor();
    resetSetupScrollPosition();
    animateViewIn(introSection);
    releaseWakeLock();
    focusForCurrentInput($("appTitle"));
  }



  // Browser chrome may change the visible viewport at normal scale, but pinch zoom must
  // not become a responsive-layout signal. Preserve the most recent unzoomed viewport
  // so the roulette keeps the same composition while the user magnifies and pans it.
  let stableUnzoomedViewport = null;
  let stableViewportOrientation = null;

  function getViewportSize() {
    const root = document.documentElement;
    return {
      width: Math.max(1, root.clientWidth || window.innerWidth),
      height: Math.max(1, root.clientHeight || window.innerHeight)
    };
  }

  function getVisibleViewportSize() {
    const layout = getViewportSize();
    const visual = window.visualViewport;
    return {
      width: Math.max(1, Math.min(layout.width, visual?.width || layout.width)),
      height: Math.max(1, Math.min(layout.height, visual?.height || layout.height))
    };
  }

  function isPageMagnified() {
    return (window.visualViewport?.scale || 1) > 1.01;
  }

  function getStableUiViewportSize() {
    const layout = getViewportSize();
    const visible = getVisibleViewportSize();
    const orientation = layout.width >= layout.height ? "landscape" : "portrait";
    const magnified = isPageMagnified();

    if (!stableUnzoomedViewport || !magnified || stableViewportOrientation !== orientation) {
      stableUnzoomedViewport = magnified ? { ...layout } : { ...visible };
      stableViewportOrientation = orientation;
    }

    return {
      width: Math.max(1, Math.min(layout.width, stableUnzoomedViewport.width)),
      height: Math.max(1, Math.min(layout.height, stableUnzoomedViewport.height))
    };
  }

  function updateViewportCssVariables() {
    const viewport = getStableUiViewportSize();
    const stableHeight = `${Math.round(viewport.height)}px`;
    document.documentElement.style.setProperty("--app-height", stableHeight);
    document.documentElement.style.setProperty("--vh", stableHeight);
    document.documentElement.classList.toggle("page-magnified", isPageMagnified());
  }

  function getAvailablePlayArea() {
    const viewport = getStableUiViewportSize();
    const topbarHeight = playTopbar?.getBoundingClientRect().height || 0;
    return {
      width: viewport.width,
      height: Math.max(0, viewport.height - topbarHeight)
    };
  }

  function updatePlayLayout() {
    if (rouletteView.hidden) return;
    const area = getAvailablePlayArea();
    const ratio = area.width / Math.max(1, area.height);
    const standardSide = area.width >= SIDE_LAYOUT_MIN_WIDTH
      && area.height >= SIDE_LAYOUT_MIN_HEIGHT
      && ratio >= SIDE_LAYOUT_MIN_RATIO;
    const compactLandscapeSide = area.width >= COMPACT_LANDSCAPE_MIN_WIDTH
      && area.height >= COMPACT_LANDSCAPE_MIN_HEIGHT
      && ratio >= COMPACT_LANDSCAPE_MIN_RATIO;
    const side = standardSide || compactLandscapeSide;
    const stacked = !side;
    const scrollMode = stacked && area.height < SCROLL_LAYOUT_MAX_HEIGHT;

    playLayout.classList.toggle("side", side);
    playLayout.classList.toggle("stacked", stacked);
    rouletteView.classList.toggle("scroll-mode", scrollMode);
    requestAnimationFrame(updateHistoryScrollHint);
  }

  function updateRouletteSize() {
    if (rouletteView.hidden) return;
    const rect = stageVisual.getBoundingClientRect();
    const scrollMode = rouletteView.classList.contains("scroll-mode");
    let size;
    if (scrollMode) {
      const availableWidth = Math.max(160, rect.width);
      const preferred = Math.min(360, getViewportSize().height * .48);
      size = Math.max(170, Math.floor(Math.min(availableWidth, preferred)));
      const nextHeight = `${size}px`;
      if (stageVisual.style.height !== nextHeight) stageVisual.style.height = nextHeight;
    } else {
      if (stageVisual.style.height) stageVisual.style.removeProperty("height");
      const freshRect = stageVisual.getBoundingClientRect();
      size = Math.max(96, Math.floor(Math.min(freshRect.width, freshRect.height, 720)));
    }
    const nextSize = `${size}px`;
    if (rouletteCard.style.getPropertyValue("--roulette-size") !== nextSize) {
      rouletteCard.style.setProperty("--roulette-size", nextSize);
    }
  }

  function openReset() {
    openModal(resetModal, lastPrimaryPointerType === "touch" ? false : $("closeResetBtn"));
  }

  function stopTimers({ preserveFinalSolo = false, preserveHistoryAutoScroll = false, preserveSpinVisual = false, preserveTickAudio = false } = {}) {
    if (!preserveHistoryAutoScroll) cancelHistoryAutoScroll();
    endHistoryScrollCapture();
    clearTimeout(state.spinTimer);
    clearTimeout(state.stopTimer);
    clearTimeout(state.autoStopTimer);
    state.spinTimer = null;
    state.lastSpinTickAt = 0;
    state.stopTimer = null;
    state.autoStopTimer = null;
    if (!preserveTickAudio) stopActiveTickSources();
    stopActiveResultTones();
    if (!preserveFinalSolo) clearFinalSoloAnimation();
    if (!preserveSpinVisual) clearSpinVisualTreatment();
  }

  function randomInt(maxExclusive) {
    if (!Number.isInteger(maxExclusive) || maxExclusive <= 0) return 0;
    const secureRandom = globalThis.crypto?.getRandomValues?.bind(globalThis.crypto);
    if (!secureRandom) return Math.floor(Math.random() * maxExclusive);
    const limit = Math.floor(0x100000000 / maxExclusive) * maxExclusive;
    const array = new Uint32Array(1);
    do { secureRandom(array); } while (array[0] >= limit);
    return array[0] % maxExclusive;
  }

  function participantById(id) {
    return state.participants.find(participant => participant.id === id) || null;
  }

  function getUnselected() {
    return state.participants.filter(participant => !state.selectedIds.has(participant.id));
  }

  function isRouletteBusy() {
    return state.phase === Phase.SPINNING || state.phase === Phase.STOPPING;
  }

  function buildSpinPool() {
    const unselected = getUnselected();
    return state.settings.hideSelectedDuringSpin ? unselected : [...state.participants];
  }

  function createRouletteFaceContent(participant) {
    if (!participant) return null;
    if (participant.type === "image") {
      const img = document.createElement("img");
      img.src = participant.value;
      img.alt = "";
      img.decoding = "async";
      return img;
    }
    const emoji = document.createElement("span");
    emoji.className = "emoji-content";
    emoji.textContent = participant.value;
    return emoji;
  }

  function renderRouletteFace(participant) {
    const nextContent = createRouletteFaceContent(participant);
    if (!nextContent) {
      rouletteVisualContent.replaceChildren();
      return;
    }
    rouletteVisualContent.replaceChildren(nextContent);
  }

  function showParticipant(participant, selected = false, showName = true) {
    renderRouletteFace(participant);
    const displayName = state.showNames && showName ? (participant?.name || "") : "";
    currentName.classList.remove("result-reveal");
    currentName.textContent = displayName;
    applyNameClass(currentName, displayName);
    rouletteCard.classList.toggle("selected", selected);
    if (selected && displayName && !state.settings.reduceEffects) {
      void currentName.offsetWidth;
      currentName.classList.add("result-reveal");
    }
  }

  function resetSpinVisualCadence() {
    pendingSpinRenderParticipant = null;
    if (spinRenderFrame !== null) cancelAnimationFrame(spinRenderFrame);
    spinRenderFrame = null;
  }



  function showSpinningParticipant(participant, { force = false } = {}) {
    pendingSpinRenderParticipant = participant;
    if (force) {
      if (spinRenderFrame !== null) cancelAnimationFrame(spinRenderFrame);
      spinRenderFrame = null;
      const latest = pendingSpinRenderParticipant;
      pendingSpinRenderParticipant = null;
      showParticipant(latest, false, false);
      return true;
    }
    if (spinRenderFrame !== null) return false;
    spinRenderFrame = requestAnimationFrame(() => {
      spinRenderFrame = null;
      const latest = pendingSpinRenderParticipant;
      pendingSpinRenderParticipant = null;
      if (latest) showParticipant(latest, false, false);
    });
    return true;
  }


  function cancelSpinVisualPriming() {
    if (spinVisualPrimeFrame1 !== null) cancelAnimationFrame(spinVisualPrimeFrame1);
    if (spinVisualPrimeFrame2 !== null) cancelAnimationFrame(spinVisualPrimeFrame2);
    spinVisualPrimeFrame1 = null;
    spinVisualPrimeFrame2 = null;
  }

  function beginSpinVisualTreatment() {
    cancelSpinVisualPriming();
    rouletteCard.classList.add("spin-visual-priming");
    rouletteCard.classList.add("spin-visual-active");
    rouletteCard.classList.toggle("spin-visual-reduced", state.settings.reduceEffects);
    rouletteCard.classList.remove("spin-visual-revealing");
    rouletteCard.style.removeProperty("--spin-visual-reveal-duration");
    spinVisualPrimeFrame1 = requestAnimationFrame(() => {
      spinVisualPrimeFrame1 = null;
      spinVisualPrimeFrame2 = requestAnimationFrame(() => {
        spinVisualPrimeFrame2 = null;
        rouletteCard.classList.remove("spin-visual-priming");
      });
    });
  }

  function beginSpinVisualReveal(durationMs) {
    if (!rouletteCard.classList.contains("spin-visual-active")) return;
    const duration = Math.max(420, Math.round(Number(durationMs) || 900));
    rouletteCard.style.setProperty("--spin-visual-reveal-duration", `${duration}ms`);
    rouletteCard.classList.add("spin-visual-revealing");
  }

  function clearSpinVisualTreatment() {
    cancelSpinVisualPriming();
    rouletteCard.classList.remove("spin-visual-active", "spin-visual-reduced", "spin-visual-revealing", "spin-visual-priming");
    rouletteCard.style.removeProperty("--spin-visual-reveal-duration");
    resetSpinVisualCadence();
  }

  function updateRouletteInteraction() {
    const enabled = state.settings.oneTouch;
    const busy = isRouletteBusy();
    mainButton.hidden = enabled;
    mainButtonSlot.hidden = enabled;
    rouletteCard.classList.toggle("one-touch", enabled);
    rouletteCard.classList.toggle("busy", enabled && busy);
    rouletteCard.classList.toggle("complete-action", enabled && state.phase === Phase.COMPLETE);
    if (enabled) {
      rouletteCard.setAttribute("role", "button");
      rouletteCard.tabIndex = 0;
      const label = busy
        ? "ルーレットを処理中"
        : state.phase === Phase.COMPLETE
          ? "全員の順番が決まりました リセットメニューを開く"
          : "ルーレットをスタート";
      rouletteCard.setAttribute("aria-label", label);
      rouletteCard.setAttribute("aria-disabled", String(busy));
    } else {
      rouletteCard.classList.remove("complete-action");
      rouletteCard.removeAttribute("role");
      rouletteCard.removeAttribute("tabindex");
      rouletteCard.removeAttribute("aria-label");
      rouletteCard.removeAttribute("aria-disabled");
    }
  }

  function finishMenuClose({ restoreFocus = false } = {}) {
    clearTimeout(menuCloseTimer);
    menuCloseTimer = null;
    const wasOpen = !menuPopover.hidden;
    menuPopover.hidden = true;
    menuDismissLayer.hidden = true;
    menuPopover.classList.remove("is-opening", "is-closing", "opens-up");
    $("menuBtn").setAttribute("aria-expanded", "false");
    if (restoreFocus && wasOpen) $("menuBtn").focus();
  }

  function closeMenuPopover({ restoreFocus = false, fromHistory = false, immediate = false } = {}) {
    if (menuPopover.hidden) return;
    $("menuBtn").setAttribute("aria-expanded", "false");
    if (!fromHistory) consumeOverlayHistory();
    if (immediate) {
      finishMenuClose({ restoreFocus });
      return;
    }
    menuPopover.classList.remove("is-opening");
    menuPopover.classList.add("is-closing");
    menuCloseTimer = setTimeout(() => finishMenuClose({ restoreFocus }), state.settings.reduceEffects ? 50 : 105);
  }



  function positionMenuPopover() {
    if (menuPopover.hidden) return;
    const buttonRect = $("menuBtn").getBoundingClientRect();
    const viewport = window.visualViewport;
    const viewportLeft = viewport?.offsetLeft || 0;
    const viewportTop = viewport?.offsetTop || 0;
    const viewportWidth = viewport?.width || window.innerWidth;
    const viewportHeight = viewport?.height || window.innerHeight;
    const gap = 7;
    const edge = 8;

    menuPopover.style.visibility = "hidden";
    menuPopover.style.left = "0px";
    menuPopover.style.top = "0px";
    const popoverRect = menuPopover.getBoundingClientRect();
    const rightLimit = viewportLeft + viewportWidth - popoverRect.width - edge;
    let left = Math.max(viewportLeft + edge, Math.min(buttonRect.right - popoverRect.width, rightLimit));
    let top = buttonRect.bottom + gap;
    const bottomLimit = viewportTop + viewportHeight - edge;
    if (top + popoverRect.height > bottomLimit) {
      top = Math.max(viewportTop + edge, buttonRect.top - popoverRect.height - gap);
    }
    menuPopover.classList.toggle("opens-up", top < buttonRect.top);
    menuPopover.style.left = `${Math.round(left)}px`;
    menuPopover.style.top = `${Math.round(top)}px`;
    menuPopover.style.visibility = "visible";
  }

  function openMenuPopover() {
    if (isRouletteBusy()) return;
    guardNextViewInteraction();
    if (!menuPopover.hidden) {
      closeMenuPopover();
      return;
    }
    clearTimeout(menuCloseTimer);
    menuDismissLayer.hidden = false;
    menuPopover.hidden = false;
    menuPopover.classList.remove("is-opening", "is-closing");
    $("menuBtn").setAttribute("aria-expanded", "true");
    positionMenuPopover();
    pushOverlayHistory("menu");
    void menuPopover.offsetWidth;
    menuPopover.classList.add("is-opening");
    setTimeout(() => menuPopover.classList.remove("is-opening"), state.settings.reduceEffects ? 50 : 150);
    if (lastPrimaryPointerType === "keyboard") requestAnimationFrame(() => focusableElements(menuPopover)[0]?.focus());
    else if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
  }



  function renderPlayState({ updateHistory = true, scrollHistoryToLatest = false } = {}) {
    rouletteView.classList.toggle("names-hidden", !state.showNames);
    const total = state.participants.length;
    const decided = state.order.length;
    const remaining = total - decided;
    const busy = isRouletteBusy();
    remainingStatus.textContent = `残り${remaining}人`;
    const resultsDisabled = busy || decided === 0;
    showResultsBtn.disabled = resultsDisabled;
    showResultsBtn.setAttribute("aria-disabled", String(resultsDisabled));
    const previousDecided = Number(progressTrack.getAttribute("aria-valuenow")) || 0;
    const progressIsDecreasing = decided < previousDecided;
    progressTrack.setAttribute("aria-valuemax", String(total));
    progressTrack.setAttribute("aria-valuenow", String(decided));
    progressTrack.setAttribute("aria-valuetext", `${total}人中${decided}人の順番が決定`);
    if (progressTransitionRestoreFrame !== null) {
      cancelAnimationFrame(progressTransitionRestoreFrame);
      progressTransitionRestoreFrame = null;
    }
    if (progressIsDecreasing) {
      progressFill.style.transitionDuration = "0s";
      progressFill.style.width = `${total ? (decided / total) * 100 : 0}%`;
      void progressFill.offsetWidth;
      progressTransitionRestoreFrame = requestAnimationFrame(() => {
        progressFill.style.transitionDuration = state.settings.reduceEffects ? "0s" : "300ms";
        progressTransitionRestoreFrame = null;
      });
    } else {
      progressFill.style.transitionDuration = state.settings.reduceEffects ? "0s" : "300ms";
      progressFill.style.width = `${total ? (decided / total) * 100 : 0}%`;
    }
    const rouletteIsComplete = state.phase === Phase.COMPLETE;
    const rouletteWasComplete = rouletteCard.classList.contains("is-complete");
    if (rouletteIsComplete) {
      rouletteCard.classList.remove("complete-resetting");
      rouletteCard.classList.add("is-complete");
    } else if (rouletteWasComplete) {
      rouletteCard.classList.add("complete-resetting");
      rouletteCard.classList.remove("is-complete");
      void rouletteCard.offsetWidth;
      requestAnimationFrame(() => rouletteCard.classList.remove("complete-resetting"));
    }
    progressPanel.classList.toggle("is-complete", rouletteIsComplete);
    mainButton.classList.toggle("stopping", state.phase === Phase.STOPPING);
    mainButton.setAttribute("aria-busy", String(state.phase === Phase.STOPPING));

    const undoDisabled = busy || decided === 0;
    $("undoBtn").disabled = undoDisabled;
    $("undoBtn").setAttribute("aria-disabled", String(undoDisabled));
    $("menuBtn").disabled = busy;
    $("menuBtn").setAttribute("aria-disabled", String(busy));
    $("soundBtn").disabled = false;
    $("fullscreenBtn").disabled = false;
    if (busy) closeMenuPopover();

    if (state.phase === Phase.COMPLETE) {
      mainButton.textContent = "リセット";
      mainButton.classList.add("complete");
      mainButton.disabled = false;
      orderStatus.textContent = "全員決定";
    } else if (busy) {
      mainButton.textContent = "ストップ";
      mainButton.classList.remove("complete");
      mainButton.disabled = state.phase === Phase.STOPPING;
      orderStatus.textContent = "決定中";
    } else {
      mainButton.textContent = "スタート";
      mainButton.classList.remove("complete");
      mainButton.disabled = false;
      orderStatus.textContent = decided ? `${decided}番まで決定` : "まだ選ばれていません";
    }
    updateRouletteInteraction();
    if (updateHistory) renderHistory({ scrollToLatest: scrollHistoryToLatest });
  }

  function edgeFadeAlpha(distance, ramp = 24) {
    const strength = Math.max(0, Math.min(1, distance / ramp));
    return String(Math.round((1 - strength) * 1000) / 1000);
  }

  function updateScrollEdgeSurface(element) {
    if (!element?.isConnected) return;
    const maxVerticalScroll = Math.max(0, element.scrollHeight - element.clientHeight);
    const position = Math.max(0, Math.min(maxVerticalScroll, element.scrollTop));
    const hasVerticalOverflow = maxVerticalScroll > 1;
    element.classList.toggle("has-vertical-scroll-edge", hasVerticalOverflow);
    element.style.setProperty(
      "--app-edge-top-alpha",
      hasVerticalOverflow ? edgeFadeAlpha(position) : "1"
    );
    element.style.setProperty(
      "--app-edge-bottom-alpha",
      hasVerticalOverflow ? edgeFadeAlpha(maxVerticalScroll - position) : "1"
    );
  }

  function scheduleScrollEdgeUpdate(element) {
    if (!element || scrollEdgeFrames.has(element)) return;
    const frame = requestAnimationFrame(() => {
      scrollEdgeFrames.delete(element);
      updateScrollEdgeSurface(element);
    });
    scrollEdgeFrames.set(element, frame);
  }

  function scheduleAllScrollEdgeUpdates() {
    scrollEdgeSurfaces.forEach(scheduleScrollEdgeUpdate);
  }

  function registerScrollEdgeSurface(element, { observeMutations = true } = {}) {
    if (!element || scrollEdgeSurfaces.has(element)) return;
    scrollEdgeSurfaces.add(element);
    element.classList.add("app-scroll-edge-surface");
    element.addEventListener("scroll", () => scheduleScrollEdgeUpdate(element), { passive: true });
    if (typeof ResizeObserver === "function") {
      const observer = new ResizeObserver(() => scheduleScrollEdgeUpdate(element));
      observer.observe(element);
      scrollEdgeObservers.push(observer);
    }
    if (observeMutations && typeof MutationObserver === "function") {
      const observer = new MutationObserver(() => scheduleScrollEdgeUpdate(element));
      observer.observe(element, { childList: true, subtree: true, characterData: true });
      scrollEdgeObservers.push(observer);
    }
    scheduleScrollEdgeUpdate(element);
  }

  function installScrollEdgeSurfaces() {
    document.querySelectorAll(".modal-body, .image-error-list").forEach(element => {
      registerScrollEdgeSurface(element);
    });
  }

  function updateHistoryScrollHint() {
    if (!historyListWrap) return;
    const isSide = playLayout.classList.contains("side");
    const maxHorizontalScroll = Math.max(0, historyList.scrollWidth - historyList.clientWidth);
    const maxVerticalScroll = Math.max(0, historyList.scrollHeight - historyList.clientHeight);
    const horizontalPosition = Math.max(0, Math.min(maxHorizontalScroll, historyList.scrollLeft));
    const verticalPosition = Math.max(0, Math.min(maxVerticalScroll, historyList.scrollTop));
    const leftDistance = maxHorizontalScroll > 0 ? horizontalPosition : 0;
    const rightDistance = maxHorizontalScroll > 0 ? maxHorizontalScroll - horizontalPosition : 0;
    const topDistance = maxVerticalScroll > 0 ? verticalPosition : 0;
    const bottomDistance = maxVerticalScroll > 0 ? maxVerticalScroll - verticalPosition : 0;

    historyList.style.setProperty("--history-left-edge-alpha", isSide ? "1" : edgeFadeAlpha(leftDistance));
    historyList.style.setProperty("--history-right-edge-alpha", isSide ? "1" : edgeFadeAlpha(rightDistance));
    historyList.style.setProperty("--history-top-edge-alpha", isSide ? edgeFadeAlpha(topDistance) : "1");
    historyList.style.setProperty("--history-bottom-edge-alpha", isSide ? edgeFadeAlpha(bottomDistance) : "1");

    historyListWrap.classList.toggle("can-scroll-left", !isSide && leftDistance > 0);
    historyListWrap.classList.toggle("can-scroll-right", !isSide && rightDistance > 0);
    historyListWrap.classList.toggle("can-scroll-up", isSide && topDistance > 0);
    historyListWrap.classList.toggle("can-scroll-down", isSide && bottomDistance > 0);
  }

  function setHistoryAutoScrollActive(active) {
    historyAutoScrollActive = active;
    historyList.classList.toggle("is-auto-scrolling", active);
    historyList.setAttribute("aria-busy", String(active));
    historyListWrap.classList.toggle("is-auto-scrolling", active);
  }

  function finishHistoryAutoScroll() {
    clearTimeout(historyAutoScrollSettleTimer);
    clearTimeout(historyAutoScrollFallbackTimer);
    historyAutoScrollSettleTimer = null;
    historyAutoScrollFallbackTimer = null;
    if (historyAutoScrollEndHandler) {
      historyList.removeEventListener("scroll", historyAutoScrollEndHandler);
      historyAutoScrollEndHandler = null;
    }
    setHistoryAutoScrollActive(false);
    updateHistoryScrollHint();
  }

  function cancelHistoryAutoScroll() {
    if (historyAutoScrollActive) {
      historyList.scrollTo({
        left: historyList.scrollLeft,
        top: historyList.scrollTop,
        behavior: "auto"
      });
    }
    finishHistoryAutoScroll();
  }

  function beginHistoryScrollCapture() {
    cancelHistoryAutoScroll();
    endHistoryScrollCapture();

    const maxLeft = Math.max(0, historyList.scrollWidth - historyList.clientWidth);
    const maxTop = Math.max(0, historyList.scrollHeight - historyList.clientHeight);
    historyScrollCapturePosition = {
      left: Math.max(0, Math.min(maxLeft, historyList.scrollLeft)),
      top: Math.max(0, Math.min(maxTop, historyList.scrollTop))
    };
    historyScrollCaptureActive = true;
    historyList.classList.add("is-scroll-captured");
    historyList.setAttribute("aria-busy", "true");

    const pinPosition = () => {
      if (!historyScrollCaptureActive || !historyScrollCapturePosition) return;
      const currentMaxLeft = Math.max(0, historyList.scrollWidth - historyList.clientWidth);
      const currentMaxTop = Math.max(0, historyList.scrollHeight - historyList.clientHeight);
      const left = Math.max(0, Math.min(currentMaxLeft, historyScrollCapturePosition.left));
      const top = Math.max(0, Math.min(currentMaxTop, historyScrollCapturePosition.top));
      historyList.scrollLeft = left;
      historyList.scrollTop = top;
      historyScrollCaptureFrame = requestAnimationFrame(pinPosition);
    };

    historyList.scrollLeft = historyScrollCapturePosition.left;
    historyList.scrollTop = historyScrollCapturePosition.top;
    historyScrollCaptureFrame = requestAnimationFrame(pinPosition);
  }

  function endHistoryScrollCapture() {
    if (historyScrollCaptureFrame !== null) {
      cancelAnimationFrame(historyScrollCaptureFrame);
      historyScrollCaptureFrame = null;
    }
    historyScrollCaptureActive = false;
    historyScrollCapturePosition = null;
    historyList.classList.remove("is-scroll-captured");
    if (!historyAutoScrollActive) historyList.setAttribute("aria-busy", "false");
    updateHistoryScrollHint();
  }

  function animateHistoryToLatest() {
    cancelHistoryAutoScroll();
    const isSide = playLayout.classList.contains("side");
    const targetLeft = isSide ? historyList.scrollLeft : Math.max(0, historyList.scrollWidth - historyList.clientWidth);
    const targetTop = isSide ? Math.max(0, historyList.scrollHeight - historyList.clientHeight) : historyList.scrollTop;
    const distance = isSide
      ? targetTop - historyList.scrollTop
      : targetLeft - historyList.scrollLeft;

    if (Math.abs(distance) < 1 || state.settings.reduceEffects) {
      historyList.scrollTo({ left: targetLeft, top: targetTop, behavior: "auto" });
      updateHistoryScrollHint();
      return;
    }

    setHistoryAutoScrollActive(true);
    const finishAfterSettling = () => {
      clearTimeout(historyAutoScrollSettleTimer);
      historyAutoScrollSettleTimer = window.setTimeout(finishHistoryAutoScroll, 120);
    };
    historyAutoScrollEndHandler = finishAfterSettling;
    historyList.addEventListener("scroll", historyAutoScrollEndHandler, { passive: true });
    historyAutoScrollFallbackTimer = window.setTimeout(finishHistoryAutoScroll, 1200);
    historyList.scrollTo({ left: targetLeft, top: targetTop, behavior: "smooth" });
  }

  function createHistoryItem(id, index, { animate = false } = {}) {
    const participant = participantById(id);
    const item = document.createElement("div");
    item.className = "history-item";
    item.dataset.id = id;
    item.setAttribute("aria-label", state.showNames
      ? `${index + 1}番 ${participant.name}`
      : `${index + 1}番の参加者`);
    const order = document.createElement("div");
    order.className = "history-order";
    order.textContent = String(index + 1);
    const media = createFaceNode(participant, "history-media");
    item.append(order, media);
    if (state.showNames) {
      const name = document.createElement("div");
      name.className = "history-name";
      name.textContent = participant.name;
      applyNameClass(name, participant.name);
      item.appendChild(name);
    }
    if (animate && !state.settings.reduceEffects) {
      item.classList.add("is-entering");
      item.addEventListener("animationend", () => item.classList.remove("is-entering"), { once: true });
    }
    return item;
  }

  function renderHistory({ scrollToLatest = false } = {}) {
    const previousLeft = historyList.scrollLeft;
    const previousTop = historyList.scrollTop;
    cancelHistoryAutoScroll();
    historyList.classList.toggle("names-hidden", !state.showNames);

    const modeKey = state.showNames ? "shown" : "hidden";
    const existingItems = Array.from(historyList.children);
    const existingIds = existingItems.map(item => item.dataset.id || "");
    const canAppendSingle = historyList.dataset.nameMode === modeKey
      && existingIds.length + 1 === state.order.length
      && existingIds.every((id, index) => id === state.order[index]);

    if (!state.order.length) {
      historyList.replaceChildren();
      historyList.dataset.nameMode = modeKey;
      historyList.scrollLeft = 0;
      historyList.scrollTop = 0;
      requestAnimationFrame(updateHistoryScrollHint);
      return;
    }

    if (canAppendSingle) {
      const index = state.order.length - 1;
      historyList.appendChild(createHistoryItem(state.order[index], index, { animate: true }));
    } else {
      historyList.replaceChildren(...state.order.map((id, index) => createHistoryItem(id, index)));
      const maxLeft = Math.max(0, historyList.scrollWidth - historyList.clientWidth);
      const maxTop = Math.max(0, historyList.scrollHeight - historyList.clientHeight);
      historyList.scrollLeft = Math.min(previousLeft, maxLeft);
      historyList.scrollTop = Math.min(previousTop, maxTop);
    }
    historyList.dataset.nameMode = modeKey;

    requestAnimationFrame(() => {
      updateHistoryScrollHint();
      if (scrollToLatest) requestAnimationFrame(animateHistoryToLatest);
    });
  }

  let audioContext = null;
  let effectMasterGain = null;
  let effectCompressor = null;
  let tickOutputGain = null;
  let tickBuffer = null;
  const activeTickSources = new Set();
  const activeResultOscillators = new Set();
  let lastTickAudioStartTime = 0;

  function createTickBuffer(context) {
    const duration = .016;
    const frameCount = Math.max(1, Math.round(context.sampleRate * duration));
    const buffer = context.createBuffer(1, frameCount, context.sampleRate);
    const channel = buffer.getChannelData(0);
    let phasePrimary = 0;
    let phaseOvertone = 0;
    for (let index = 0; index < frameCount; index += 1) {
      const time = index / context.sampleRate;
      const progress = time / duration;
      const frequency = 1120 - 360 * progress;
      phasePrimary += 2 * Math.PI * frequency / context.sampleRate;
      phaseOvertone += 2 * Math.PI * frequency * 1.72 / context.sampleRate;
      const attack = Math.min(1, time / .0012);
      const decay = Math.exp(-time * 235);
      channel[index] = (Math.sin(phasePrimary) + .34 * Math.sin(phaseOvertone)) * attack * decay * .72;
    }
    return buffer;
  }

  function prepareAudioOutput() {
    if (!audioContext || !audioMasterGain || !state.soundOn) return;
    const now = audioContext.currentTime;
    audioMasterGain.gain.cancelScheduledValues(now);
    if (audioNeedsFadeIn || audioMasterGain.gain.value < .1) {
      audioMasterGain.gain.setValueAtTime(Math.max(.0001, audioMasterGain.gain.value), now);
      audioMasterGain.gain.linearRampToValueAtTime(.92, now + .04);
      audioNeedsFadeIn = false;
    } else {
      audioMasterGain.gain.setValueAtTime(.92, now);
    }
  }

  function fadeAudioOut({ stopSources = true } = {}) {
    if (!audioContext || !audioMasterGain) {
      if (stopSources) { stopActiveTickSources(); stopActiveResultTones(); }
      return;
    }
    const now = audioContext.currentTime;
    audioMasterGain.gain.cancelScheduledValues(now);
    audioMasterGain.gain.setValueAtTime(Math.max(.0001, audioMasterGain.gain.value), now);
    audioMasterGain.gain.linearRampToValueAtTime(.0001, now + .035);
    setTimeout(() => {
      if (stopSources) { stopActiveTickSources(); stopActiveResultTones(); }
    }, 45);
    audioNeedsFadeIn = true;
  }

  function ensureAudio() {
    if (!audioContext) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return false;
      try {
        audioContext = new AudioContextClass();
        audioMasterGain = audioContext.createGain();
        audioMasterGain.gain.value = .92;
        audioMasterGain.connect(audioContext.destination);

        tickOutputGain = audioContext.createGain();
        tickOutputGain.gain.value = .92;
        tickOutputGain.connect(audioMasterGain);
        tickBuffer = createTickBuffer(audioContext);

        effectMasterGain = audioContext.createGain();
        effectMasterGain.gain.value = .92;
        effectCompressor = audioContext.createDynamicsCompressor();
        effectCompressor.threshold.value = -7;
        effectCompressor.knee.value = 8;
        effectCompressor.ratio.value = 2.6;
        effectCompressor.attack.value = .002;
        effectCompressor.release.value = .08;
        effectMasterGain.connect(effectCompressor);
        effectCompressor.connect(audioMasterGain);
      } catch (error) {
        console.warn("音声機能を初期化できませんでした。", error);
        audioContext = null;
        audioMasterGain = null;
        effectMasterGain = null;
        effectCompressor = null;
        tickOutputGain = null;
        tickBuffer = null;
        return false;
      }
    }
    if (audioContext.state === "suspended") audioContext.resume().catch(() => {});
    prepareAudioOutput();
    return true;
  }


  function connectEffectAudio(node) {
    node.connect(effectMasterGain || audioContext.destination);
  }

  function cancelTickSequenceScheduler() {
    clearTimeout(tickSequenceSchedulerTimer);
    tickSequenceSchedulerTimer = null;
    tickSequenceSchedulerGeneration += 1;
  }

  function stopActiveTickSources() {
    cancelTickSequenceScheduler();
    activeTickSources.forEach(source => {
      try { source.stop(); } catch (error) { /* Already stopped. */ }
      try { source.disconnect(); } catch (error) { /* Already disconnected. */ }
    });
    activeTickSources.clear();
    lastTickAudioStartTime = 0;
  }

  function scheduleTickAt(startTime) {
    if (!state.soundOn || !audioContext || !tickBuffer || !tickOutputGain) return null;
    const source = audioContext.createBufferSource();
    source.buffer = tickBuffer;
    source.connect(tickOutputGain);
    activeTickSources.add(source);
    source.addEventListener("ended", () => {
      activeTickSources.delete(source);
      try { source.disconnect(); } catch (error) { /* Already disconnected. */ }
    }, { once: true });
    const safeStartTime = Math.max(audioContext.currentTime + .002, Number(startTime) || audioContext.currentTime);
    source.start(safeStartTime);
    lastTickAudioStartTime = safeStartTime;
    return safeStartTime;
  }

  function scheduleTick(delayMs = 0) {
    if (!audioContext) return null;
    return scheduleTickAt(audioContext.currentTime + Math.max(0, Number(delayMs) || 0) / 1000);
  }

  function playTick() {
    prepareAudioOutput();
    scheduleTick(0);
  }

  function scheduleTickSequence(stepIntervals) {
    if (!Array.isArray(stepIntervals) || !stepIntervals.length
      || !state.soundOn || !audioContext || !tickBuffer || !tickOutputGain) return;
    cancelTickSequenceScheduler();
    const generation = tickSequenceSchedulerGeneration;
    let nextTime = audioContext.currentTime;
    const tickTimes = stepIntervals.map(interval => {
      nextTime += Math.max(0, Number(interval) || 0) / 1000;
      return nextTime;
    });
    let index = 0;
    const lookAheadSeconds = .14;
    const schedulerIntervalMs = 32;

    const pump = () => {
      if (generation !== tickSequenceSchedulerGeneration || !audioContext) return;
      const horizon = audioContext.currentTime + lookAheadSeconds;
      while (index < tickTimes.length && tickTimes[index] <= horizon) {
        scheduleTickAt(tickTimes[index]);
        index += 1;
      }
      if (index < tickTimes.length) {
        tickSequenceSchedulerTimer = setTimeout(pump, schedulerIntervalMs);
      } else {
        tickSequenceSchedulerTimer = null;
      }
    };
    pump();
  }

  function continuedTickDelay(baseDelay, fallbackElapsed) {
    if (state.soundOn && audioContext && lastTickAudioStartTime > 0) {
      const elapsed = Math.max(0, (audioContext.currentTime - lastTickAudioStartTime) * 1000);
      if (elapsed <= baseDelay * 2.5) {
        return Math.max(4, Math.min(baseDelay, baseDelay - elapsed));
      }
    }
    return Math.max(4, Math.min(baseDelay, baseDelay - fallbackElapsed));
  }

  function stopActiveResultTones() {
    activeResultOscillators.forEach(oscillator => {
      try { oscillator.stop(); } catch (error) { /* Already stopped. */ }
      try { oscillator.disconnect(); } catch (error) { /* Already disconnected. */ }
    });
    activeResultOscillators.clear();
  }

  function scheduleResultTone(frequency, startTime, duration, level) {
    [
      { type: "sine", ratio: 1, gain: level },
      { type: "triangle", ratio: 2, gain: level * .30 }
    ].forEach(voice => {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = voice.type;
      oscillator.frequency.setValueAtTime(frequency * voice.ratio, startTime);
      gain.gain.setValueAtTime(.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(voice.gain, startTime + .010);
      gain.gain.setTargetAtTime(
        .0001,
        startTime + Math.max(.07, duration * .30),
        Math.max(.025, duration * .11)
      );
      oscillator.connect(gain);
      connectEffectAudio(gain);
      activeResultOscillators.add(oscillator);
      oscillator.addEventListener("ended", () => {
        activeResultOscillators.delete(oscillator);
        try { oscillator.disconnect(); } catch (error) { /* Already disconnected. */ }
        try { gain.disconnect(); } catch (error) { /* Already disconnected. */ }
      }, { once: true });
      oscillator.start(startTime);
      oscillator.stop(startTime + duration + .04);
    });
  }

  function playStop(isComplete = false) {
    if (!state.soundOn || !audioContext) return;
    prepareAudioOutput();
    stopActiveTickSources();
    stopActiveResultTones();
    const start = audioContext.currentTime + .016;
    const notes = isComplete
      ? [
          { frequency: 659.25, duration: .25, level: .47 },
          { frequency: 880.00, duration: .28, level: .49 },
          { frequency: 1108.73, duration: .40, level: .52 }
        ]
      : [
          { frequency: 659.25, duration: .26, level: .47 },
          { frequency: 880.00, duration: .32, level: .50 }
        ];
    notes.forEach((note, index) => {
      scheduleResultTone(note.frequency, start + index * .10, note.duration, note.level);
    });
  }

  function clearFinalSoloAnimation() {
    state.isFinalSoloSpin = false;
  }

  function beginFinalSoloAnimation() {
    state.isFinalSoloSpin = true;
    beginSpinVisualTreatment();
  }

  function beginFinalSoloFocusTransition(durationMs) {
    beginSpinVisualReveal(durationMs);
  }

  function startFinalSoloSpin(target, interval) {
    const generation = state.generation;
    state.spinPool = [target];
    state.poolPosition = 0;
    state.currentId = target.id;
    showParticipant(target, false, false);
    void rouletteFace.offsetWidth;
    beginFinalSoloAnimation();
    setPhase(Phase.SPINNING, { force: true });
    renderPlayState({ updateHistory: false });

    const tick = () => {
      if (!generationIsCurrent(generation) || state.phase !== Phase.SPINNING) return;
      state.lastSpinTickAt = performance.now();
      playTick();
      state.spinTimer = setTimeout(tick, interval);
    };
    tick();
  }

  function stopFinalSoloSpin(target, elapsedSinceTick) {
    const generation = state.generation;
    state.pendingTargetId = target.id;
    if (!historyScrollCaptureActive) beginHistoryScrollCapture();
    const config = stopMap[state.settings.stopLength];
    const baseDelay = speedMap[state.settings.speed];
    const totalSteps = Math.max(8, Math.round(config.minSteps * .68));
    const stepDelays = Array.from({ length: totalSteps }, (_, index) => {
      const progress = Math.min(1, index / Math.max(1, totalSteps - 1));
      return Math.round(baseDelay + (config.maxDelay - baseDelay) * easeInCubic(progress));
    });
    const firstDelay = continuedTickDelay(baseDelay, elapsedSinceTick);
    const focusDuration = firstDelay + stepDelays.slice(1).reduce((sum, delay) => sum + delay, 0);
    let completed = 0;

    setPhase(Phase.STOPPING, { force: true });
    beginFinalSoloFocusTransition(focusDuration);
    renderPlayState({ updateHistory: false });

    const advance = () => {
      if (!generationIsCurrent(generation) || state.phase !== Phase.STOPPING) return;
      state.lastSpinTickAt = performance.now();
      completed += 1;
      const isFinalStep = completed >= totalSteps;
      if (!isFinalStep) {
        state.stopTimer = setTimeout(advance, stepDelays[completed]);
      } else {
        finishSelection(target);
      }
    };

    scheduleTickSequence([firstDelay, ...stepDelays.slice(1, Math.max(1, totalSteps - 1))]);
    state.stopTimer = setTimeout(advance, firstDelay);
  }

  function startSpin() {
    if (resultInputLocked()) return;
    const pool = buildSpinPool();
    if (!pool.length) return;
    rouletteCard.classList.remove("selection-emphasis");
    stopTimers({ preserveHistoryAutoScroll: true });
    const generation = state.generation;
    const interval = speedMap[state.settings.speed];
    const isFinalSolo = state.settings.hideSelectedDuringSpin && pool.length === 1 && getUnselected().length === 1;
    announce("抽選を開始しました");
    if (isFinalSolo) {
      startFinalSoloSpin(pool[0], interval);
      return;
    }

    state.spinPool = pool;
    const currentPosition = pool.findIndex(participant => participant.id === state.currentId);
    state.poolPosition = currentPosition >= 0 ? currentPosition : 0;
    setPhase(Phase.SPINNING, { force: true });
    rouletteCard.classList.remove("selected");
    currentName.classList.remove("result-reveal", "undo-reveal");
    currentName.textContent = "";
    applyNameClass(currentName, "");
    resetSpinVisualCadence();
    beginSpinVisualTreatment();
    showSpinningParticipant(state.spinPool[state.poolPosition], { force: true });
    renderPlayState({ updateHistory: false });
    const advanceSpin = () => {
      if (!generationIsCurrent(generation) || state.phase !== Phase.SPINNING) return;
      state.poolPosition = (state.poolPosition + 1) % state.spinPool.length;
      const participant = state.spinPool[state.poolPosition];
      state.currentId = participant.id;
      showSpinningParticipant(participant);
      state.lastSpinTickAt = performance.now();
      playTick();
      state.spinTimer = setTimeout(advanceSpin, interval);
    };
    state.lastSpinTickAt = performance.now();
    state.spinTimer = setTimeout(advanceSpin, interval);
  }


  function easeInCubic(t) { return t * t * t; }

  function stopSpin() {
    if (state.phase !== Phase.SPINNING) return;
    const generation = state.generation;
    const stopRequestedAt = performance.now();
    const elapsedSinceTick = state.lastSpinTickAt ? Math.max(0, stopRequestedAt - state.lastSpinTickAt) : 0;
    const wasFinalSolo = state.isFinalSoloSpin;
    stopTimers({ preserveFinalSolo: wasFinalSolo, preserveHistoryAutoScroll: true, preserveSpinVisual: true, preserveTickAudio: true });
    const candidates = getUnselected();
    if (!candidates.length) return;
    const target = candidates[randomInt(candidates.length)];
    state.pendingTargetId = target.id;
    beginHistoryScrollCapture();

    if (wasFinalSolo) {
      stopFinalSoloSpin(target, elapsedSinceTick);
      return;
    }

    const targetPosition = state.spinPool.findIndex(participant => participant.id === target.id);
    const poolLength = state.spinPool.length;
    const forward = (targetPosition - state.poolPosition + poolLength) % poolLength;
    const config = stopMap[state.settings.stopLength];
    let totalSteps = forward + config.extraCycles * poolLength;
    while (totalSteps < config.minSteps) totalSteps += poolLength;
    const easingSteps = Math.min(15, Math.max(8, Math.round(Math.sqrt(totalSteps) * 2.2)));
    const easingStart = totalSteps - easingSteps;
    const baseDelay = speedMap[state.settings.speed];
    let completed = 0;

    setPhase(Phase.STOPPING, { force: true });
    renderPlayState({ updateHistory: false });

    const delayForCompleted = completedSteps => {
      if (completedSteps < easingStart) return baseDelay;
      const progress = Math.min(1, (completedSteps - easingStart) / Math.max(1, easingSteps - 1));
      return Math.round(baseDelay + (config.maxDelay - baseDelay) * easeInCubic(progress));
    };
    const advance = () => {
      if (!generationIsCurrent(generation) || state.phase !== Phase.STOPPING) return;
      state.poolPosition = (state.poolPosition + 1) % poolLength;
      const participant = state.spinPool[state.poolPosition];
      state.currentId = participant.id;
      showSpinningParticipant(participant);
      state.lastSpinTickAt = performance.now();
      completed += 1;
      if (completed < totalSteps) state.stopTimer = setTimeout(advance, delayForCompleted(completed));
      else finishSelection(target);
    };
    const firstDelay = continuedTickDelay(baseDelay, elapsedSinceTick);
    const visualRevealDuration = firstDelay + Array.from({ length: Math.max(0, totalSteps - 1) }, (_, index) => delayForCompleted(index + 1)).reduce((sum, delay) => sum + delay, 0);
    beginSpinVisualReveal(visualRevealDuration);
    const stopTickIntervals = [firstDelay];
    for (let step = 1; step < totalSteps - 1; step += 1) stopTickIntervals.push(delayForCompleted(step));
    scheduleTickSequence(stopTickIntervals);
    state.stopTimer = setTimeout(advance, firstDelay);
  }


  function playSelectionOverlay() {
    if (state.settings.reduceEffects) return;
    clearTimeout(playSelectionOverlay.timer);
    rouletteCard.classList.remove("selection-emphasis");
    void rouletteCard.offsetWidth;
    rouletteCard.classList.add("selection-emphasis");
    playSelectionOverlay.timer = setTimeout(() => {
      rouletteCard.classList.remove("selection-emphasis");
    }, 320);
  }

  function finishSelection(target, { silent = false, animate = true } = {}) {
    if (!target || state.selectedIds.has(target.id)) return;
    endHistoryScrollCapture();
    clearFinalSoloAnimation();
    clearSpinVisualTreatment();
    state.pendingTargetId = null;
    state.currentId = target.id;
    state.order.push(target.id);
    state.selectedIds.add(target.id);
    const isComplete = state.order.length === state.participants.length;
    setPhase(isComplete ? Phase.COMPLETE : Phase.RESULT, { force: true });
    showParticipant(target, true, true);
    if (animate) playSelectionOverlay();
    else {
      rouletteCard.classList.remove("selection-emphasis");
      currentName.classList.remove("result-reveal");
    }
    if (!silent) playStop(isComplete);
    renderPlayState({ scrollHistoryToLatest: true });
    lockResultInput();
    const label = state.showNames ? target.name : `${state.order.length}番の参加者`;
    announce(isComplete ? `${label}、${state.order.length}番に決まりました。全員の順番が決まりました` : `${label}、${state.order.length}番に決まりました`, { force: true });
  }


  function undoLastResult() {
    if (!state.order.length || isRouletteBusy()) return;
    const removedId = state.order.pop();
    state.selectedIds.delete(removedId);
    const previousId = state.order[state.order.length - 1] || null;
    state.currentId = previousId;
    setPhase(state.order.length ? Phase.RESULT : Phase.READY, { force: true });
    const removedItem = historyList.querySelector(`[data-id="${CSS.escape(removedId)}"]`);
    if (removedItem && !state.settings.reduceEffects) {
      removedItem.classList.add("is-removing");
      setTimeout(() => {
        showParticipant(participantById(previousId), Boolean(previousId), true);
        currentName.classList.remove("result-reveal");
        if (previousId) currentName.classList.add("undo-reveal");
        renderPlayState();
      }, 155);
    } else {
      showParticipant(participantById(previousId), Boolean(previousId), true);
      currentName.classList.remove("result-reveal");
      if (previousId && !state.settings.reduceEffects) currentName.classList.add("undo-reveal");
      renderPlayState();
    }
    announce("直前の結果を取り消しました", { force: true });
    showToast("直前の結果を取り消しました", { duration: 2200, priority: 2 });
  }


  function resetOrder(render = true, { preserveGeneration = false } = {}) {
    if (!preserveGeneration) bumpGeneration();
    stopTimers();
    state.order = [];
    state.selectedIds = new Set();
    state.currentId = null;
    state.pendingTargetId = null;
    state.spinPool = [];
    state.poolPosition = 0;
    setPhase(rouletteView.hidden ? Phase.SETUP : Phase.READY, { force: true });
    showParticipant(null, false);
    rouletteCard.classList.remove("selected");
    clearFinalSoloAnimation();
    if (render) renderPlayState();

      event.preventDefault();
    }, { capture: true });
  }

  async function requestWakeLock() {
    if (!isFullscreen() || rouletteView.hidden || document.hidden || !navigator.wakeLock?.request || wakeLockSentinel) return;
    try {
      wakeLockSentinel = await navigator.wakeLock.request("screen");
      wakeLockSentinel.addEventListener("release", () => { wakeLockSentinel = null; }, { once: true });
    } catch (error) { wakeLockSentinel = null; }
  }

  async function releaseWakeLock() {
    const sentinel = wakeLockSentinel;
    wakeLockSentinel = null;
    if (!sentinel) return;
    try { await sentinel.release(); } catch (error) { /* Optional API. */ }
  }

  function isFullscreen() { return Boolean(document.fullscreenElement || document.webkitFullscreenElement); }

  function isAppleTouchDevice() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent)

  }

  async function exitFullscreenForAppleInteraction() {
    if (!isAppleTouchDevice() || !isFullscreen()) return false;
    try {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (!exit) return false;
      await Promise.resolve(exit.call(document));
      return true;
    } catch (error) {
      console.warn("全画面表示を終了できませんでした", error);
      return false;
    }
  }

  function updateFullscreenSafeArea() {
    const fullscreen = isFullscreen();
    const visualTop = fullscreen ? Math.max(0, Math.round(window.visualViewport?.offsetTop || 0)) : 0;
    const fallbackTop = fullscreen && isAppleTouchDevice() ? 30 : 0;
    const topGuard = Math.max(visualTop, fallbackTop);
    const leftGuard = fullscreen && isAppleTouchDevice() ? 78 : 0;
    document.documentElement.style.setProperty("--fullscreen-top-guard", `${topGuard}px`);
    document.documentElement.style.setProperty("--fullscreen-left-guard", `${leftGuard}px`);
    scheduleLayoutUpdate();
  }
  async function toggleFullscreen() {

        const request = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;

        await Promise.resolve(request.call(document.documentElement));
      } else {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (!exit) throw new Error("Fullscreen API unavailable");
        await Promise.resolve(exit.call(document));
      }
    } catch (error) {

  let lastVisualViewportSize = { width: window.visualViewport?.width || innerWidth, height: window.visualViewport?.height || innerHeight };
  const handleVisualViewportChange = () => {

    const next = { width: visual?.width || innerWidth, height: visual?.height || innerHeight };
    if (!isPageMagnified() && (Math.abs(next.width - lastVisualViewportSize.width) > 80 || Math.abs(next.height - lastVisualViewportSize.height) > 80)) beginLayoutInputGuard();

  showResultsBtn.addEventListener("click", openResults);

  resultViewerStage.addEventListener("pointermove", event => {
    if (event.pointerType === "mouse") setViewerControlsVisible(true);
  }, { passive: true });
  resultViewerStage.addEventListener("pointerleave", event => {
    if (event.pointerType === "mouse" && lastPrimaryPointerType !== "keyboard") setViewerControlsVisible(false, { autoHide: false });
  }, { passive: true });
  resultViewerStage.addEventListener("click", event => {
    if (performance.now() < viewerSuppressClickUntil) return;
    if (event.target.closest("button")) return;
    const rect = resultViewerStage.getBoundingClientRect();
    const ratio = (event.clientX - rect.left) / Math.max(1, rect.width);
    if (ratio <= .25) { moveResultViewer(-1); return; }
    if (ratio >= .75) { moveResultViewer(1); return; }
    setViewerControlsVisible(!state.viewerControlsVisible);
  });
  resultViewerStage.addEventListener("pointerdown", event => {
    if (event.pointerType === "mouse" || !event.isPrimary || isPageMagnified() || event.target.closest("button")) {
      viewerGestureStart = null;
      return;
    }
    viewerGestureStart = {
      pointerId: event.pointerId,
      x: event.clientX,
      y: event.clientY,
      horizontal: false
    };
  });
  resultViewerStage.addEventListener("pointermove", event => {
    if (!viewerGestureStart || event.pointerId !== viewerGestureStart.pointerId || isPageMagnified()) return;
    const dx = event.clientX - viewerGestureStart.x;
    const dy = event.clientY - viewerGestureStart.y;
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.05) {
      viewerGestureStart.horizontal = true;
      if (event.cancelable) event.preventDefault();
    }
  }, { passive: false });
  resultViewerStage.addEventListener("pointerup", event => {
    if (!viewerGestureStart || event.pointerId !== viewerGestureStart.pointerId) return;
    const gesture = viewerGestureStart;
    viewerGestureStart = null;
    if (isPageMagnified()) return;
    const dx = event.clientX - gesture.x;
    const dy = event.clientY - gesture.y;
    if (Math.abs(dx) < VIEWER_SWIPE_DISTANCE || Math.abs(dx) < Math.abs(dy) * VIEWER_SWIPE_DIRECTION_RATIO) return;
    viewerSuppressClickUntil = performance.now() + 450;
    clearResultViewerPressState();
    moveResultViewer(dx < 0 ? 1 : -1);
  });
  resultViewerStage.addEventListener("pointercancel", () => { viewerGestureStart = null; });

  window.__SUI_ROULETTE_TEST__ = Object.freeze({
    runFairnessCheck(participantCount = 8, trials = 10000) {
      const count = Math.max(2, Math.min(40, Math.floor(participantCount)));
      const total = Math.max(1000, Math.floor(trials));
      const buckets = Array.from({ length: count }, () => 0);
      for (let index = 0; index < total; index += 1) buckets[randomInt(count)] += 1;
      const expected = total / count;
      const maxRelativeDeviation = Math.max(...buckets.map(value => Math.abs(value - expected) / expected));
      return { count, total, buckets, expected, maxRelativeDeviation };
    }
  });


  function installPullToRefreshGuard() {
    let gestureStartX = 0;
    let gestureStartY = 0;
    let gestureScroller = null;
    let trackingSingleTouch = false;

    const canScrollVertically = element => {
      if (!(element instanceof HTMLElement)) return false;
      const style = getComputedStyle(element);
      return ["auto", "scroll", "overlay"].includes(style.overflowY)
        && element.scrollHeight > element.clientHeight + 1;
    };

    const findGestureScroller = target => {
      let element = target instanceof Element ? target : null;
      while (element && element !== document.documentElement) {
        if (canScrollVertically(element)) return element;
        element = element.parentElement;
      }
      if (!setupView.hidden && canScrollVertically(setupView)) return setupView;
      if (!rouletteView.hidden && rouletteView.classList.contains("scroll-mode")) return rouletteView;
      const pageScroller = document.scrollingElement;
      if (pageScroller && pageScroller.scrollHeight > pageScroller.clientHeight + 1) return pageScroller;
      return null;
    };

    const stopTracking = () => {
      trackingSingleTouch = false;
      gestureScroller = null;
    };

    document.addEventListener("touchstart", event => {
      if (event.touches.length !== 1) {
        stopTracking();
        return;
      }
      const touch = event.touches[0];
      gestureStartX = touch.clientX;
      gestureStartY = touch.clientY;
      gestureScroller = findGestureScroller(event.target);
      trackingSingleTouch = true;
    }, { passive: true, capture: true });

    document.addEventListener("touchmove", event => {
      if (!trackingSingleTouch || event.touches.length !== 1) return;
      const touch = event.touches[0];
      const deltaX = touch.clientX - gestureStartX;
      const deltaY = touch.clientY - gestureStartY;
      if (deltaY <= 0 || Math.abs(deltaY) <= Math.abs(deltaX)) return;
      if (gestureScroller && gestureScroller.scrollTop > 0.5) return;
      // Magnified pages belong entirely to the browser's visual-viewport panning.
      // Do not intercept any one-finger direction while the user is zoomed in.
      if (isPageMagnified()) return;
      if (event.cancelable) event.preventDefault();
    }, { passive: false, capture: true });

    document.addEventListener("touchend", stopTracking, { passive: true, capture: true });
    document.addEventListener("touchcancel", stopTracking, { passive: true, capture: true });
  }

  let layoutUpdateFrame = null;
  function scheduleLayoutUpdate() {
    if (layoutUpdateFrame !== null) return;
    layoutUpdateFrame = requestAnimationFrame(() => {
      layoutUpdateFrame = null;
      updateViewportCssVariables();
      updatePlayLayout();
      updateRouletteSize();

  if (typeof ResizeObserver === "function") {
