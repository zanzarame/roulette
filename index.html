<style>
  :root {
    --navy: #17324d;
    --navy-2: #214a6c;
    --cream: #fffaf0;
    --paper: #ffffff;
    --ink: #17324d;
    --muted: #657789;
    --line: #d9e2e8;
    --accent: #e96b4c;
    --accent-dark: #bd4d35;
    --gold: #f2c94c;
    --focus-ring: #ffd84d;
    --focus-ring-width: 4px;
    --blue: #3b82b4;
    --blue-dark: #28678f;
    --danger: #b84c4c;
    --shadow: 0 16px 40px rgba(11, 34, 53, .22);
    --radius: 22px;
    --vh: 100vh;
    --fullscreen-top-guard: 0px;
    --fullscreen-left-guard: 0px;
    --app-height: 100vh;
    --effective-safe-top: max(env(safe-area-inset-top, 0px), var(--fullscreen-top-guard));

    --button-primary-bg: var(--blue);
    --button-primary-hover: #3478a6;
    --button-secondary-bg: #e7f2f8;
    --button-secondary-hover: #d9ebf4;
    --button-secondary-text: var(--blue-dark);
    --button-neutral-bg: #edf3f6;
    --button-neutral-hover: #e2ebf0;
    --button-danger-bg: #f8e8e8;
    --button-danger-hover: #f3dada;
    --button-danger-text: var(--danger);
    --button-on-dark-bg: rgba(255,255,255,.14);
    --button-on-dark-hover: rgba(255,255,255,.22);
  }

  @supports (height: 100dvh) {
    :root { --vh: 100dvh; }
  }

  * { box-sizing: border-box; }
  html {
    margin: 0;
    min-height: 100%;
  }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.16), transparent 30%),
      linear-gradient(145deg, var(--navy-2), var(--navy));
    min-height: var(--vh);
    font-family:
      "BIZ UDPGothic",
      "Hiragino Kaku Gothic ProN",
      "Hiragino Sans",
      "Yu Gothic",
      "YuGothic",
      "Meiryo",
      system-ui,
      sans-serif;
  }

  button {
    font: inherit;
  }
  input, select { font: inherit; }

  [hidden] { display: none !important; }

  .view { min-height: var(--vh); }
  .setup-view {
    padding: clamp(18px, 3vw, 36px);
    overflow-y: auto;
  }
  .setup-shell {
    margin: 0 auto;
    width: min(980px, 100%);
  }
  .panel {
    background: rgba(255,255,255,.97);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: clamp(20px, 4vw, 38px);
  }
  .intro-actions { display: grid; gap: 12px; }

    /*
    .button — 2 blocks
    1. base button
    2. flat surface reset
  */
.button {
    border: 0;
    border-radius: 14px;
    padding: 13px 18px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .08s, filter .15s, opacity .15s;
  }

  .button:active { transform: translateY(2px); }
  .button:focus-visible { outline: var(--focus-ring-width) solid var(--focus-ring); outline-offset: 3px; }
  .button:disabled { opacity: .42; cursor: not-allowed; transform: none; filter: none; }
  .primary {
    background: var(--button-primary-bg);
    color: #fff;
  }

  .danger-solid {
    border: 0;
    background: var(--danger);
    color: #fff;
  }
  .ghost {
    background: var(--button-neutral-bg);
    color: var(--ink);
  }

  .danger-soft:hover {
    background: var(--button-danger-hover);
  }
  .large { min-height: 54px; font-size: 18px; }

  .editor-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 20px;
  }
  .editor-head h2 { margin: 0; font-size: clamp(23px, 3vw, 32px); }
  .editor-head p { margin: 7px 0 0; color: var(--muted); }
  .count-badge {
    min-width: 92px;
    text-align: center;
    border-radius: 999px;
    background: #edf3f6;
    padding: 10px 16px;
    font-weight: 700;
  }
  .participant-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 15px;
  }
  .participant-card {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: #fff;
    padding: 12px;
    box-shadow: 0 5px 14px rgba(11,34,53,.08);
  }
  .participant-media {
    aspect-ratio: 4 / 3;
    border-radius: 13px;
    background: var(--cream);
    display: grid;
    place-items: center;
    overflow: hidden;
    margin-bottom: 10px;
    font-size: 72px;

    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  .participant-media img { width: 100%; height: 100%; object-fit: contain; }
  .name-input {
    width: 100%;
    border: 2px solid var(--line);
    border-radius: 11px;
    padding: 10px 11px;
    font-weight: 700;
    color: var(--ink);
  }
  .name-input:focus { border-color: var(--blue); }
  .name-input:focus-visible { outline: var(--focus-ring-width) solid var(--focus-ring); outline-offset: 2px; }
  .participant-remove {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 4;
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    padding: 0;
    font-size: 24px;
    line-height: 1;
    font-weight: 900;
    cursor: pointer;
    transition: transform .08s, filter .15s, background .15s, border-color .15s;
    border: 0;
    background: var(--button-danger-bg);
    color: var(--button-danger-text);
    box-shadow: none;
  }
  .participant-remove:hover {
    border-color: var(--danger);
    background: var(--button-danger-hover);
  }
  .participant-remove:active { transform: translateY(1px) scale(.96); }
  .participant-remove:focus-visible {
    outline: var(--focus-ring-width) solid var(--focus-ring);
    outline-offset: 2px;
  }
  .editor-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
  }
  .start-row {
    border-top: 1px solid var(--line);
    margin-top: 22px;
    padding-top: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
  }
  .start-row small { color: var(--muted); line-height: 1.6; }

  .roulette-view {
    color: #fff;
    overflow: hidden;
    height: var(--vh);
    min-height: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
  }
    /*
    .play-topbar — 4 blocks
    1. base top bar
    2. auto-height guard
    3. compact spacing
    4. safe-area top guard
  */
.play-topbar {
    height: 68px;
    padding: 10px max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .play-title { font-weight: 900; letter-spacing: .05em; font-size: 19px;
 min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .top-button {
    color: #fff;
    backdrop-filter: blur(6px);
    border-radius: 11px;
    padding: 9px 12px;
    cursor: pointer;
    font-weight: 700;
    border: 0;
    background: var(--button-on-dark-bg);
    box-shadow: none;
  }
  .top-button:focus-visible { outline: var(--focus-ring-width) solid var(--focus-ring); outline-offset: 2px; }
  .top-button:disabled {
    opacity: .34;
    cursor: not-allowed;
    filter: grayscale(.25);
  }

    /*
    .play-layout — 4 blocks
    1. base side layout
    2. auto-height and side-column override
    3. shared responsive geometry
    4. overflow guard
  */
.play-layout {
    height: calc(var(--vh) - 68px);
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(230px, 310px);
    gap: 16px;
    padding: 0 16px 16px;
  }

  .roulette-card {
    border: clamp(10px, 2vw, 20px) solid var(--gold);
    background: var(--cream);
    box-shadow: 0 10px 30px rgba(0,0,0,.30), inset 0 0 0 4px rgba(0,0,0,.12);
    overflow: hidden;
    display: grid;
    place-items: center;
    color: var(--ink);
    font-size: min(40vh, 38vw);
    position: relative;
    width: var(--roulette-size, min(62vh, 62vw, 720px));
    height: var(--roulette-size, min(62vh, 62vw, 720px));
    aspect-ratio: auto;
    flex: 0 0 auto;
    border-width: 14px;
    border-radius: 28px;
    max-width: 100%;
    max-height: 100%;
  }
  .roulette-card img {
    display: block;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    padding: 10px;
  }
  .roulette-card.selected::after {
    content: "";
    position: absolute;
    inset: 5px;
    border: 6px solid var(--accent);
    border-radius: 18px;
    pointer-events: none;

 border-width: 6px; }

  .current-name {
    min-height: 1.35em;
    max-width: 80vw;
    text-align: center;
    font-size: clamp(23px, 4vw, 38px);
    font-weight: 900;
    letter-spacing: .03em;
    overflow: hidden;
    white-space: normal;
    text-overflow: clip;
    overflow-wrap: anywhere;
    line-height: 1.16;
    max-height: 2.32em;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    position: relative;
    z-index: 2;
  }
    /*
    .main-button — 2 blocks
    1. base primary action
    2. bottom-margin reset
  */
.main-button {
    border: 0;
    min-width: min(380px, 78vw);
    padding: clamp(15px, 2.5vh, 23px) 40px;
    border-radius: 999px;
    background: linear-gradient(160deg, var(--accent), var(--accent-dark));
    color: #fff;
    font-size: clamp(24px, 4vw, 34px);
    font-weight: 900;
    letter-spacing: .08em;
    box-shadow: 0 10px 0 var(--accent-dark), 0 16px 30px rgba(0,0,0,.3);
    cursor: pointer;
    margin-bottom: 10px;
  }
  .main-button:active { transform: translateY(6px); box-shadow: 0 4px 0 var(--accent-dark), 0 10px 20px rgba(0,0,0,.28); }
  .main-button:disabled {
    background: linear-gradient(160deg, #697684, #4b5661);
    box-shadow: 0 6px 0 #37404a, 0 10px 20px rgba(0,0,0,.24);
    color: rgba(255,255,255,.72);
    cursor: not-allowed;
    transform: none;
  }
  .main-button.complete { background: linear-gradient(160deg, var(--blue), var(--blue-dark)); box-shadow: 0 10px 0 var(--blue-dark), 0 16px 30px rgba(0,0,0,.3); }

    /*
    .history-panel — 2 blocks
    1. base history panel
    2. minimum-height reinforcement
  */
.history-panel {
    min-height: 0;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(255,255,255,.09);
    border-radius: 20px;
    padding: 14px;
    display: flex;
    flex-direction: column;
  }
  .history-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
 gap: 10px; }
  .history-head h2 { font-size: 17px; margin: 0; }
  .history-head span { color: rgba(255,255,255,.75); font-size: 14px; }
  .history-list { overflow-y: auto; display: grid; gap: 9px; padding: 2px;
 min-height: 0; flex: 1 1 auto;

    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;

 scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.42) transparent; }
  .history-item {
    display: grid;
    grid-template-columns: 36px 54px minmax(0,1fr);
    align-items: center;
    gap: 9px;
    border-radius: 13px;
    background: rgba(255,255,255,.11);
    padding: 7px;
  }
  .history-order { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font-weight: 900; }
  .history-media { width: 54px; height: 54px; border-radius: 9px; background: var(--cream); display: grid; place-items: center; overflow: hidden; font-size: 32px;

    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  .history-media img { width: 100%; height: 100%; object-fit: contain; }
  .history-name {
    min-width: 0;
    overflow: hidden;
    font-weight: 700;
    white-space: normal;
    text-overflow: clip;
    overflow-wrap: anywhere;
    line-height: 1.15;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .result-button {
    margin-top: auto;
    width: auto;
    margin: 0;
    padding: 8px 11px;
    white-space: nowrap;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(7, 19, 31, .82);
    display: grid;
    place-items: center;
    padding: 20px;
  }
    /*
    .modal-box — 2 blocks
    1. base modal shell
    2. structured modal layout
  */
.modal-box {
    width: min(780px, 96vw);
    max-height: min(88vh, 820px);
    overflow: auto;
    background: #fff;
    color: var(--ink);
    border-radius: 24px;
    box-shadow: 0 24px 70px rgba(0,0,0,.42);
    padding: clamp(20px, 4vw, 34px);
  }
  .modal-box.small { width: min(470px, 94vw); }
  .modal-head { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 18px;

    flex: 0 0 auto;
    min-height: 68px;
    margin: 0;
    padding: 14px clamp(18px, 3.2vw, 28px);
    border-bottom: 1px solid var(--line);
    background: #fff;
  }

  .close-x {
    border-radius: 50%;
    cursor: pointer;
    font-weight: 900;
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    display: grid;
    place-items: center;
    padding: 0;
    color: var(--ink);
    font-size: 23px;
    line-height: 1;
    border: 0;
    background: var(--button-neutral-bg);
    box-shadow: none;
  }
  .result-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 13px; }
  .result-card { border: 1px solid var(--line); border-radius: 15px; padding: 9px; position: relative; background: #fff;
 isolation: isolate; }
    /*
    .result-media — 3 blocks
    1. result media geometry
    2. emoji font fallback
    3. stacking context
  */
.result-media { aspect-ratio: 1 / 1; display: grid; place-items: center; background: var(--cream); border-radius: 11px; overflow: hidden; font-size: 66px; }
  .result-media img { width: 100%; height: 100%; object-fit: contain; }
  .result-name { margin-top: 8px; font-weight: 700; text-align: center; overflow-wrap: anywhere;
 line-height: 1.35; }
  .result-num { position: absolute; top: -8px; left: -8px; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 900;

    z-index: 3;
    box-shadow: 0 0 0 3px #fff, 0 3px 9px rgba(0,0,0,.22);
  }
  .settings-grid {
    display: grid;
    gap: 0;
  }
  .setting { display: grid; gap: 7px; }
  .setting label { font-weight: 900; }
  .setting small { color: var(--muted); line-height: 1.55; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .toggle-row input { width: 24px; height: 24px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .confirm-text {
    width: 100%;
    margin: 0;
    padding: 0;
    white-space: pre-line;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.65;
    font-weight: 700;
    text-wrap: balance;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    z-index: 150;
    width: max-content;

    font-size: clamp(23px, 3.5vw, 31px);
    font-weight: 900;

  .main-button.complete {

  /* The arrowhead and shaft share one horizontal axis; the return curve begins on that axis. */
  #undoBtn svg {

  /* Title typography and action proportions stay recognisably the same in portrait and landscape. */
  .title-screen {

    width: clamp(270px, 43vmin, 400px);
  }
  .title-brand > h1 {
    margin: clamp(12px, 2vh, 18px) 0 0;

  @media (orientation: landscape) and (max-height: 620px) {

      width: min(58vh, 280px);

    }

      gap: 16px;
    }

      width: 100%;
      min-height: 72px;
      padding: 17px 24px;
      font-size: 20px;
    }
    .sample-action {
      min-height: 34px;
      font-size: 13px;
    }
  }


  /* v5.9 — title spacing, 3:7 editor composition, result proximity and shared subtle scrollbars */

  /* The title uses one visual size in both orientations. Keep it outside the icon shadow. */
  .title-brand > h1 {
    margin-top: clamp(24px, 3.2vh, 30px);
    font-size: clamp(32px, 5vw, 40px);
  }

  /* The selected name sits close to the roulette, but below the deepest part of its shadow. */
  .stage {
    row-gap: 0;
  }
  .result-summary {
    margin-top: clamp(18px, 2.3vh, 24px);
    gap: 6px;
  }
  .main-button-slot {
    margin-top: clamp(8px, 1.4vh, 14px);
  }
  .roulette-view.scroll-mode .result-summary {
    margin-top: 18px;
  }

  /* History uses the same low-emphasis scrollbar in side and stacked layouts. */
  .play-layout.stacked .history-list-wrap::after,
  .play-layout.side .history-list-wrap::before,
  .play-layout.side .history-list-wrap::after {
    content: none !important;
    display: none !important;
  }
  .history-list {
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.26) transparent;
  }
  .history-list::-webkit-scrollbar {
    display: block;
    width: 5px;
    height: 5px;
  }
  .history-list::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.26);
    border-radius: 999px;
  }
  .history-list::-webkit-scrollbar-thumb:hover {

  }

    background: transparent;
  }
  @media (pointer: coarse) {

      height: 4px;

      padding-bottom: 7px;
    }
    .play-layout.side .history-list {
      padding-right: 5px;
    }
  }

  /* Keep the approved undo drawing; centre horizontally from the return arc while preserving the shared vertical optical line. */
  #undoBtn svg {
    transform: translateX(-.5px);
  }

  /* Landscape add cards use a clear 3:7 split: icon centred on the left, text left-aligned on the right. */
  @media (orientation: landscape) and (min-width: 621px) {
    .editor-add-action,
    .editor-panel.is-empty .editor-add-action,
    .editor-panel:not(.is-empty) .editor-add-action {
      grid-template-columns: 3fr 7fr;
      grid-template-rows: 1fr;
      justify-content: stretch;
      justify-items: stretch;
      align-items: center;
      gap: 0;
      padding: clamp(16px, 3vh, 24px) clamp(16px, 2.2vw, 26px);
      text-align: left;
    }
    .editor-action-icon,
    .editor-panel.is-empty .editor-action-icon {
      justify-self: center;
      align-self: center;
    }
    .editor-action-label,
    .editor-panel.is-empty .editor-action-label {
      justify-self: start;
      align-self: center;
      padding-left: clamp(8px, 1.3vw, 16px);

  /* Portrait title composition: same title size as landscape, no shadow collision, and a deliberate pause before the action. */
  @media (orientation: portrait) and (max-width: 760px) {

      min-height: calc(var(--vh) - 20px);
      align-content: center;

  @media (orientation: portrait) and (max-height: 700px) {

      gap: clamp(34px, 5.2vh, 46px);
    }
    .title-selector-icon {
      width: clamp(214px, 61vw, 276px);
    }

  /* v5.10 — touch isolation, stable press recovery and smoother selection feedback */

  /* Centre the approved undo drawing on the return arc itself. */
  #undoBtn svg {
    transform: translate(-.5px, -3.75px);
  }

  /* Give the compact undo confirmation the same visual hierarchy as other short confirmations. */
  .confirm-title.compact {
    font-size: clamp(18px, 4.2vw, 22px);
  }

  /* Slightly rounded, low-emphasis history scrollbars in both orientations. */
  .history-list::-webkit-scrollbar,
  .history-list::-webkit-scrollbar-track,
  .history-list::-webkit-scrollbar-thumb {
    border-radius: 3px;
  }


  /* The name-display switch has breathing room on its right edge. */
  .participant-name-setting {
    padding-right: clamp(15px, 1.8vw, 20px);
  }
  @media (max-width: 620px) {
    .participant-name-setting { padding-right: 15px; }
  }


  /* A transparent guard absorbs the delayed native click after touch-driven view changes. */
  .transition-input-guard { display: none !important; }

  /* Touch browsers can keep :hover latched after a cancelled press; restore each control's base surface. */
  @media (hover: none), (pointer: coarse) {
    .button:hover { filter: none; }
    .primary:hover { background: var(--action-blue); }
    #beginBtn:hover { background: var(--action-blue); }
    .secondary:hover { background: var(--button-secondary-bg); }
    .ghost:hover, .neutral-action:hover, .warning-soft:hover { background: var(--button-neutral-bg); }
    .danger-soft:hover { background: var(--button-danger-bg); }
    .danger-solid:hover { background: var(--danger); }
    .top-button:hover { background: var(--button-on-dark-bg); filter: none; }
    .close-x:hover { background: var(--button-neutral-bg); }
    .participant-remove:hover { background: #edf2f5; color: #657789; }
    .menu-option:hover,
    .menu-popover .menu-option:hover { background: transparent; }
    .reset-option:hover, .restart-option:hover, .edit-option:hover { background: var(--reset-blue); }
    .reset-option.destructive:hover, .home-option:hover { background: var(--reset-red); }
    .editor-add-action:hover,
    .editor-panel.is-empty .editor-add-action:hover { background: var(--choice-blue); }
    .title-register-button:hover { background: linear-gradient(180deg, #4b94bd 0%, #347ca8 100%); }
    .main-button:hover {
      background: linear-gradient(180deg, #f0805f 0%, #d95f43 100%);
      filter: none;
    }
    .main-button.complete:hover {
      background: linear-gradient(180deg, #4b94bd 0%, #347ca8 100%);
      filter: none;
    }
    .result-button:not(:disabled):hover {
      border-color: rgba(255,255,255,.16);
      background: rgba(255,255,255,.10);
      color: rgba(255,255,255,.72);
    }
    .participant-name-setting:hover {
      background: #f5f8fa;
      border-color: #d5e0e7;
    }
    .sample-action:hover {
      background: transparent;
      color: rgba(255,255,255,.48);
      text-decoration: none;
    }
  }


  /* v5.11 — optical undo alignment, consistent pressed feedback, card rhythm and shared scrollbars */

  /* Keep the approved undo drawing and lower it only enough to centre the return arc optically. */
  #undoBtn svg {
    transform: translate(-.5px, -3px);
  }

  /* The editor start action and the blue reset state visibly darken while pressed. */
  #beginBtn:not(.pseudo-disabled):active,
  #beginBtn:not(.pseudo-disabled).press-held.press-inside {
    background: var(--action-blue-hover);
    filter: brightness(.96);
  }
  .main-button.complete:active,
  .main-button.complete.press-held.press-inside {
    background: linear-gradient(180deg, #4388b1 0%, #2e6f98 100%);
    filter: brightness(.94);
  }

  /* Hidden name fields must not leave an inline baseline below the media. */
  .name-input {
    display: block;
  }
  .participant-card.names-hidden .name-input {
    margin: 0;
    line-height: 0;
  }

  /* Landscape keeps exactly the same signature curvature as portrait in every state. */
  .play-layout.side .main-button,
  .play-layout.side .main-button:hover,
  .play-layout.side .main-button:active,
  .play-layout.side .main-button.press-held,
  .play-layout.side .main-button.press-held.press-inside,
  .play-layout.side .main-button.complete,
  .play-layout.side .main-button.complete:active {
    border-radius: var(--signature-radius);
  }



  /* One scrollbar geometry is shared by every scrollable surface in the app. */
  :root {
    --app-scrollbar-size: 6px;
    --app-scrollbar-radius: 999px;
    --app-scrollbar-thumb: rgba(101,119,137,.34);
    --app-scrollbar-thumb-hover: rgba(101,119,137,.50);
  }
  :where(
    .setup-view,
    .roulette-view.scroll-mode,
    .modal-body,
    .settings-modal-body,
    .history-list,
    .image-error-list
  ) {
    scrollbar-width: thin;
    scrollbar-color: var(--surface-scrollbar-thumb, var(--app-scrollbar-thumb)) transparent;
  }
  :where(
    .setup-view,
    .roulette-view.scroll-mode,
    .modal-body,
    .settings-modal-body,
    .history-list,
    .image-error-list
  )::-webkit-scrollbar {
    width: var(--app-scrollbar-size);
    height: var(--app-scrollbar-size);
  }
  :where(
    .setup-view,
    .roulette-view.scroll-mode,
    .modal-body,
    .settings-modal-body,
    .history-list,
    .image-error-list
  )::-webkit-scrollbar-thumb {
    min-width: 18px;
    min-height: 18px;
    border-radius: var(--app-scrollbar-radius);
    background: var(--surface-scrollbar-thumb, var(--app-scrollbar-thumb));
  }
  :where(
    .setup-view,
    .roulette-view.scroll-mode,
    .modal-body,
    .settings-modal-body,
    .history-list,
    .image-error-list
  )::-webkit-scrollbar-thumb:hover {
    background: var(--surface-scrollbar-thumb-hover, var(--app-scrollbar-thumb-hover));
  }
  :where(
    .setup-view,
    .roulette-view.scroll-mode,
    .modal-body,
    .settings-modal-body,
    .history-list,
    .image-error-list
  )::-webkit-scrollbar-track {
    border-radius: var(--app-scrollbar-radius);
    background: transparent;
  }
  :where(
    .setup-view,
    .roulette-view.scroll-mode,
    .modal-body,
    .settings-modal-body,
    .history-list,
    .image-error-list
  )::-webkit-scrollbar-corner {
    background: transparent;
  }
  .history-list {
    --surface-scrollbar-thumb: rgba(255,255,255,.28);
    --surface-scrollbar-thumb-hover: rgba(255,255,255,.42);
  }

  @media (pointer: coarse) {
    :root { --app-scrollbar-size: 5px; }
  }


  /* v5.12 — unified layout, fully rounded scrollbars, blended history edges and compositor-only selection emphasis */

  /* Preserve the approved undo path and lower its arc centre by another 0.75px. */
  #undoBtn svg {
    transform: translate(-.5px, -2.25px);
  }

  /* The history viewport clips to its rounded inner edge; scrollable content fades into that edge without a shadow. */
  .history-list-wrap {
    overflow: hidden;
    border-radius: 12px;
  }
  .history-list {
    --history-edge-fade: 11px;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
  }
  .play-layout.side .history-list-wrap.can-scroll-up:not(.can-scroll-down) .history-list {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--history-edge-fade), #000 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 var(--history-edge-fade), #000 100%);
  }
  .play-layout.side .history-list-wrap.can-scroll-down:not(.can-scroll-up) .history-list {
    -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - var(--history-edge-fade)), transparent 100%);
    mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - var(--history-edge-fade)), transparent 100%);
  }
  .play-layout.side .history-list-wrap.can-scroll-up.can-scroll-down .history-list {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--history-edge-fade), #000 calc(100% - var(--history-edge-fade)), transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 var(--history-edge-fade), #000 calc(100% - var(--history-edge-fade)), transparent 100%);
  }
  .play-layout.stacked .history-list-wrap.can-scroll-left:not(.can-scroll-right) .history-list {
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--history-edge-fade), #000 100%);
    mask-image: linear-gradient(to right, transparent 0, #000 var(--history-edge-fade), #000 100%);
  }
  .play-layout.stacked .history-list-wrap.can-scroll-right:not(.can-scroll-left) .history-list {
    -webkit-mask-image: linear-gradient(to right, #000 0, #000 calc(100% - var(--history-edge-fade)), transparent 100%);
    mask-image: linear-gradient(to right, #000 0, #000 calc(100% - var(--history-edge-fade)), transparent 100%);
  }
  .play-layout.stacked .history-list-wrap.can-scroll-left.can-scroll-right .history-list {
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--history-edge-fade), #000 calc(100% - var(--history-edge-fade)), transparent 100%);
    mask-image: linear-gradient(to right, transparent 0, #000 var(--history-edge-fade), #000 calc(100% - var(--history-edge-fade)), transparent 100%);
  }

  /* Use a slightly wider hit channel with a fully pill-shaped visible thumb on every scroll surface. */
  :root {
    --app-scrollbar-size: 8px;
    --app-scrollbar-thumb-border: 2px;
  }
  :where(
    .setup-view,
    .roulette-view.scroll-mode,
    .modal-body,
    .settings-modal-body,
    .history-list,
    .image-error-list
  )::-webkit-scrollbar-thumb {
    border: var(--app-scrollbar-thumb-border) solid transparent;
    border-radius: 999px;
    background-clip: padding-box;
  }
  :where(
    .setup-view,
    .roulette-view.scroll-mode,
    .modal-body,
    .settings-modal-body,
    .history-list,
    .image-error-list
  )::-webkit-scrollbar-track {
    border-radius: 999px;
  }
  @media (pointer: coarse) {
    :root {
      --app-scrollbar-size: 7px;
      --app-scrollbar-thumb-border: 2px;
    }
  }


  /* v5.13 — persistent stopping-state feedback and stable held results control */

  /* Disabled roulette actions remain visibly unavailable even when touch browsers latch :hover. */
  .main-button.stopping,
  .main-button.stopping:hover,
  .main-button.stopping:active,
  .main-button.stopping.press-held,
  .main-button.stopping.press-held.press-inside,
  .main-button:disabled,
  .main-button:disabled:hover,
  .main-button:disabled:active,
  .main-button:disabled.press-held,
  .main-button:disabled.press-held.press-inside,
  .main-button.complete:disabled,
  .main-button.complete:disabled:hover,
  .main-button.complete:disabled:active,
  .main-button.complete:disabled.press-held,
  .main-button.complete:disabled.press-held.press-inside {
    border-color: rgba(255,255,255,.20);
    border-radius: var(--signature-radius);
    background: linear-gradient(180deg, #8d746d 0%, #675b59 100%);
    box-shadow:
      0 4px 0 rgba(18,48,68,.40),
      0 9px 18px rgba(4,20,32,.18),
      inset 0 1px 0 rgba(255,255,255,.12);
    color: rgba(255,255,255,.68);
    cursor: not-allowed;
    filter: saturate(.58) brightness(.78);
    opacity: 1;
    transform: none;
  }

  /* Keep the quiet result control in its pressed state for the whole touch hold. */
  .result-button:not(:disabled).press-held.press-inside,
  .result-button:not(:disabled).press-held.press-inside:hover,
  .result-button:not(:disabled):active {
    border-color: rgba(255,255,255,.28);
    background: rgba(255,255,255,.20);
    color: rgba(255,255,255,.92);
    filter: none;
    transform: translateY(1px) scale(.985);
  }
  .result-button:not(:disabled).press-held:not(.press-inside),
  .result-button:not(:disabled).press-held:not(.press-inside):hover {
    border-color: rgba(255,255,255,.16);
    background: rgba(255,255,255,.10);
    color: rgba(255,255,255,.72);
    filter: none;
    transform: none;
  }


  /* v5.14 — disabled result stability, square history viewport, visible pill scrollbars and annotation consistency */

  /* A disabled result control never enters a pressed visual state. */
  .result-button:disabled,
  .result-button:disabled:hover,
  .result-button:disabled:active,
  .result-button:disabled.press-held,
  .result-button:disabled.press-inside,
  .result-button:disabled.press-held.press-inside {
    border-color: rgba(255,255,255,.08);
    background: rgba(255,255,255,.045);
    color: rgba(255,255,255,.34);
    box-shadow: none;
    filter: none;
    opacity: 1;
    transform: none;
    pointer-events: none;
  }

  /* The history viewport itself is strictly rectangular. */
  .history-list-wrap {
    border-radius: 0 !important;
    overflow: hidden;
  }

  /* Keep the history unmasked outside the active side/stacked layouts.
     The continuously blended edge masks defined later remain authoritative. */
  .history-list {
    -webkit-mask-image: none;
    mask-image: none;

  function hideCurrentToast(immediate = false) {
    clearTimeout(showToast.timer);

    if (toast.hidden) {
      currentToastRecord = null;
      return;
    }
    const finish = () => {
      toast.hidden = true;
      toast.classList.remove("toast-entering", "toast-leaving");
      currentToastRecord = null;
      const next = toastQueue.shift();
      if (next) showToast(next.message, next.options);
    };
    if (immediate || state.settings.reduceEffects) {
      finish();
      return;
    }
    toast.classList.remove("toast-entering");
    toast.classList.add("toast-leaving");
    showToast.hideTimer = setTimeout(finish, 105);
  }

  function showToast(message, durationOrOptions = 3200) {
    const clean = String(message).trim().replace(/[。、！？!?]+$/u, "");
    const options = typeof durationOrOptions === "number"
      ? { duration: durationOrOptions }
      : { ...(durationOrOptions || {}) };
    const duration = options.duration ?? (toastPriorityFor(clean) === 3 ? 3200 : toastPriorityFor(clean) === 2 ? 2200 : 1800);
    const priority = options.priority ?? toastPriorityFor(clean);
    const now = performance.now();

    if (currentToastRecord?.message === clean) {
      clearTimeout(showToast.timer);
      currentToastRecord.expiresAt = now + duration;
      showToast.timer = setTimeout(() => hideCurrentToast(false), duration);
      return;
    }
    if (currentToastRecord) {
      if (priority >= currentToastRecord.priority) {
        toastQueue.length = 0;
        hideCurrentToast(true);
      } else {
        if (toastQueue.length < 2) toastQueue.push({ message: clean, options: { duration, priority } });
        return;
      }
    }

    currentToastRecord = { message: clean, priority, expiresAt: now + duration };
    toast.textContent = clean;
    const wasHidden = toast.hidden;
    toast.hidden = false;
    toast.classList.remove("toast-leaving");
    if (wasHidden && !state.settings.reduceEffects) {
      toast.classList.remove("toast-entering");
      void toast.offsetWidth;
      toast.classList.add("toast-entering");
    }
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => hideCurrentToast(false), duration);
  }
